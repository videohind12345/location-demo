<!DOCTYPE html>
<html lang="hi">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Location Dashboard</title>

<style>

* {
    box-sizing: border-box;
}

body {

    margin: 0;

    padding: 20px;

    font-family: Arial, sans-serif;

    background: #f4f7fb;

    color: #222;
}

.container {

    max-width: 800px;

    margin: auto;
}

.card {

    background: white;

    padding: 25px;

    border-radius: 18px;

    box-shadow:
    0 5px 20px rgba(0,0,0,.10);
}

h1 {

    text-align: center;

    margin-top: 0;
}

.status {

    padding: 14px;

    border-radius: 10px;

    text-align: center;

    background: #e9f8ee;

    color: #16803a;

    font-weight: bold;

    margin-bottom: 15px;
}

button {

    width: 100%;

    padding: 14px;

    border: 0;

    border-radius: 10px;

    background: #1976d2;

    color: white;

    font-size: 17px;

    font-weight: bold;

    cursor: pointer;

    margin-bottom: 15px;
}

.latest {

    border: 2px solid #ddd;

    border-radius: 15px;

    padding: 18px;

    margin-bottom: 25px;
}

.history-title {

    font-size: 22px;

    font-weight: bold;

    margin: 20px 0 12px;
}

.history-item {

    background: white;

    border: 1px solid #ddd;

    border-radius: 12px;

    padding: 15px;

    margin-bottom: 12px;

    box-shadow:
    0 2px 8px rgba(0,0,0,.06);
}

.row {

    padding: 7px 0;

    border-bottom: 1px solid #eee;

    word-break: break-word;
}

.row:last-child {

    border-bottom: none;
}

.label {

    font-weight: bold;
}

.accuracy-good {

    color: #16803a;

    font-weight: bold;
}

.accuracy-medium {

    color: #d47b00;

    font-weight: bold;
}

.accuracy-bad {

    color: #d00000;

    font-weight: bold;
}

.map {

    display: inline-block;

    margin-top: 10px;

    padding: 10px 14px;

    background: #16803a;

    color: white;

    text-decoration: none;

    border-radius: 8px;

    font-weight: bold;
}

.empty {

    text-align: center;

    padding: 25px;

    color: #777;
}

.error {

    display: none;

    background: #ffecec;

    color: #b00020;

    padding: 14px;

    border-radius: 10px;

    margin-top: 15px;

    white-space: pre-wrap;

    word-break: break-word;
}

.time {

    color: #666;

    font-size: 14px;

    margin-top: 8px;
}

</style>

</head>


<body>

<div class="container">

<div class="card">

<h1>📍 Location Dashboard</h1>

<div id="status"
class="status">

🔄 Location data पढ़ी जा रही है...

</div>

<button id="refreshBtn">

🔄 Refresh Location

</button>


<!-- =============================
     LATEST
============================= -->

<div class="latest">

<h2>🟢 Latest Location</h2>

<div id="latestContent">

लोड हो रहा है...

</div>

</div>


<!-- =============================
     HISTORY
============================= -->

<div class="history-title">

📜 Location History

</div>

<div id="history">

<div class="empty">

History loading...

</div>

</div>


<div id="error"
class="error">
</div>


</div>

</div>


<script>

/* =================================
   SUPABASE
================================= */

const SUPABASE_URL =
"https://qtfnupdojsqpuywhoryu.supabase.co";

const SUPABASE_KEY =
"sb_publishable_GAsXGjXdKTZxlm5tqx-t0w_96i3RmKE";


/* =================================
   ELEMENTS
================================= */

const statusBox =
document.getElementById("status");

const refreshBtn =
document.getElementById("refreshBtn");

const latestContent =
document.getElementById("latestContent");

const historyBox =
document.getElementById("history");

const errorBox =
document.getElementById("error");


/* =================================
   FORMAT TIME
================================= */

function formatTime(value) {

    if (!value) {

        return "समय उपलब्ध नहीं";
    }

    const date =
    new Date(value);

    if (
        isNaN(date.getTime())
    ) {

        return value;
    }

    return date.toLocaleString(
        "en-IN",
        {
            dateStyle: "medium",
            timeStyle: "medium"
        }
    );
}


/* =================================
   ACCURACY CLASS
================================= */

function accuracyClass(value) {

    const n =
    Number(value);

    if (!Number.isFinite(n)) {

        return "";
    }

    if (n <= 20) {

        return "accuracy-good";
    }

    if (n <= 100) {

        return "accuracy-medium";
    }

    return "accuracy-bad";
}


/* =================================
   GOOGLE MAP
================================= */

function mapLink(
    latitude,
    longitude
) {

    return `
    <a
    class="map"
    target="_blank"
    href="https://www.google.com/maps?q=${encodeURIComponent(latitude)},${encodeURIComponent(longitude)}">
    📍 Open Google Maps
    </a>
    `;
}


/* =================================
   LOAD DATA
================================= */

async function loadLocations() {

    refreshBtn.disabled = true;

    statusBox.textContent =
    "🔄 Latest location पढ़ी जा रही है...";

    errorBox.style.display =
    "none";


    try {

        /*
          सबसे नई location पहले
        */

        const url =
        SUPABASE_URL +
        "/rest/v1/locations" +
        "?select=id,device_id,latitude,longitude,accuracy,created_at" +
        "&order=created_at.desc" +
        "&limit=100";


        const response =
        await fetch(
            url,
            {

                method: "GET",

                headers: {

                    "apikey":
                    SUPABASE_KEY,

                    "Authorization":
                    "Bearer " +
                    SUPABASE_KEY
                }
            }
        );


        if (!response.ok) {

            const text =
            await response.text();

            throw new Error(
                "Supabase Error " +
                response.status +
                "\n" +
                text
            );
        }


        const data =
        await response.json();


        if (
            !data ||
            data.length === 0
        ) {

            latestContent =
            `<div class="empty">
            अभी कोई location नहीं मिली।
            </div>`;

            historyBox.innerHTML =
            `<div class="empty">
            कोई history उपलब्ध नहीं है।
            </div>`;

            statusBox.textContent =
            "⚠️ कोई location नहीं मिली।";

            refreshBtn.disabled =
            false;

            return;
        }


        /* =========================
           LATEST
        ========================= */

        const latest =
        data[0];


        const latestAccuracy =
        Number(latest.accuracy);


        latestContent = null;


        latestContent.innerHTML = "";


        latestContent.insertAdjacentHTML(
            "beforeend",

            `
            <div class="row">
                <div class="label">📱 Device:</div>
                ${latest.device_id || "Unknown"}
            </div>

            <div class="row">
                <div class="label">🌐 Latitude:</div>
                ${latest.latitude}
            </div>

            <div class="row">
                <div class="label">🌐 Longitude:</div>
                ${latest.longitude}
            </div>

            <div class="row">
                <div class="label">🎯 Accuracy:</div>
                <span class="${accuracyClass(latestAccuracy)}">
                    ${Number.isFinite(latestAccuracy)
                        ? Math.round(latestAccuracy) + " मीटर"
                        : latest.accuracy}
                </span>
            </div>

            <div class="row">
                <div class="label">🕐 Created at:</div>
                ${formatTime(latest.created_at)}
            </div>

            ${mapLink(
                latest.latitude,
                latest.longitude
            )}
            `
        );


        /* =========================
           HISTORY
        ========================= */

        historyBox.innerHTML = "";


        data.forEach(
            function(location, index) {

                const accuracy =
                Number(location.accuracy);


                const item =
                document.createElement(
                    "div"
                );

                item.className =
                "history-item";


                item.innerHTML = `

                <div class="row">
                    <div class="label">
                        #${index + 1}
                    </div>
                </div>

                <div class="row">
                    <div class="label">
                        📱 Device:
                    </div>
                    ${location.device_id || "Unknown"}
                </div>

                <div class="row">
                    <div class="label">
                        🌐 Latitude:
                    </div>
                    ${location.latitude}
                </div>

                <div class="row">
                    <div class="label">
                        🌐 Longitude:
                    </div>
                    ${location.longitude}
                </div>

                <div class="row">
                    <div class="label">
                        🎯 Accuracy:
                    </div>

                    <span class="${accuracyClass(accuracy)}">

                    ${
                        Number.isFinite(accuracy)
                        ? Math.round(accuracy)
                          + " मीटर"
                        : location.accuracy
                    }

                    </span>

                </div>

                <div class="time">

                    🕐 ${formatTime(
                        location.created_at
                    )}

                </div>

                ${mapLink(
                    location.latitude,
                    location.longitude
                )}

                `;


                historyBox.appendChild(
                    item
                );

            }
        );


        statusBox.textContent =
        "🟢 Latest location मिल गई।";


    } catch (error) {

        console.error(error);

        statusBox.textContent =
        "🔴 Location पढ़ने में समस्या।";

        errorBox.style.display =
        "block";

        errorBox.textContent =
        error.message;
    }


    refreshBtn.disabled =
    false;
}


/* =================================
   REFRESH
================================= */

refreshBtn.addEventListener(
    "click",
    loadLocations
);


/* =================================
   FIRST LOAD
================================= */

loadLocations();


/* =================================
   AUTO REFRESH
================================= */

setInterval(
    loadLocations,
    5000
);

</script>

</body>

</html>
