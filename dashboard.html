<!DOCTYPE html>
<html lang="hi">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Location Dashboard</title>

<style>

*{
    box-sizing:border-box;
}

body{

    margin:0;

    font-family:Arial,sans-serif;

    background:#f2f4f7;

    padding:20px;
}

.container{

    max-width:900px;

    margin:auto;
}

.header{

    background:white;

    padding:20px;

    border-radius:16px;

    box-shadow:
    0 4px 15px rgba(0,0,0,.1);

    margin-bottom:20px;
}

h1{

    margin:0 0 10px;
}

button{

    padding:13px 20px;

    border:0;

    border-radius:10px;

    background:#2563eb;

    color:white;

    font-size:16px;

    cursor:pointer;
}

.status{

    margin-top:15px;

    padding:12px;

    border-radius:10px;

    background:#f3f4f6;
}

.location-card{

    background:white;

    padding:20px;

    border-radius:16px;

    box-shadow:
    0 4px 15px rgba(0,0,0,.1);

    margin-bottom:20px;
}

.location-title{

    font-size:20px;

    font-weight:bold;

    margin-bottom:15px;
}

.info{

    line-height:1.8;
}

.map{

    display:inline-block;

    margin-top:15px;

    padding:12px 18px;

    background:#16a34a;

    color:white;

    text-decoration:none;

    border-radius:10px;
}

.empty{

    background:white;

    padding:25px;

    border-radius:16px;

    text-align:center;
}

.time{

    color:#666;

    font-size:14px;
}

</style>

</head>

<body>

<div class="container">

<div class="header">

<h1>📍 Location Dashboard</h1>

<p>
Latest shared location
</p>

<button onclick="loadLocation()">
🔄 Refresh Location
</button>

<div
id="status"
class="status">
Location loading...
</div>

</div>


<div id="locationArea">

</div>

</div>


<script>

/* ================================
   SUPABASE
================================ */

const SUPABASE_URL =
"https://qtfnupdojsqpuywhoryu.supabase.co";

const SUPABASE_KEY =
"sb_publishable_GAsXGjXdKTZxlm5tqx-t0w_96i3RmKE";


/* ================================
   LOAD LATEST LOCATIONS
================================ */

async function loadLocation(){

    const status =
    document.getElementById("status");

    const area =
    document.getElementById("locationArea");


    status.innerHTML =
    "⏳ Latest location loading...";


    try{

        const response =
        await fetch(

            SUPABASE_URL +
            "/rest/v1/locations" +
            "?select=*" +
            "&order=created_at.desc",

            {

                method:"GET",

                headers:{

                    "apikey":
                    SUPABASE_KEY,

                    "Authorization":
                    "Bearer " +
                    SUPABASE_KEY
                }
            }
        );


        if(!response.ok){

            const text =
            await response.text();

            console.log(text);

            throw new Error(
                "Unable to load locations"
            );
        }


        const data =
        await response.json();


        if(data.length === 0){

            status.innerHTML =
            "⚪ अभी कोई location नहीं मिली।";

            area.innerHTML =
            '<div class="empty">' +
            "अभी कोई location share नहीं की गई है।" +
            "</div>";

            return;
        }


        /*
          केवल सबसे latest row
        */

        const location =
        data[0];


        const map =
        "https://www.google.com/maps?q=" +
        location.latitude +
        "," +
        location.longitude;


        const time =
        new Date(
            location.created_at
        ).toLocaleString();


        status.innerHTML =
        "🟢 Latest location मिल गई।";


        area.innerHTML =

        '<div class="location-card">' +

        '<div class="location-title">' +
        "📍 Latest Location" +
        "</div>" +

        '<div class="info">' +

        "<b>Device:</b><br>" +
        location.device_id +

        "<br><br>" +

        "<b>Latitude:</b> " +
        location.latitude +

        "<br>" +

        "<b>Longitude:</b> " +
        location.longitude +

        "<br>" +

        "<b>Accuracy:</b> लगभग " +
        Math.round(
            location.accuracy || 0
        ) +
        " मीटर" +

        "<br><br>" +

        '<span class="time">' +
        "🕐 " +
        time +
        "</span>" +

        "</div>" +

        '<a class="map" ' +
        'href="' +
        map +
        '" ' +
        'target="_blank">' +

        "📍 Open Google Maps" +

        "</a>" +

        "</div>";
    }

    catch(error){

        console.error(error);

        status.innerHTML =
        "❌ Unable to load location.";

        area.innerHTML =
        '<div class="empty">' +
        "Dashboard location load नहीं कर पाया।" +
        "<br><br>" +
        error.message +
        "</div>";
    }
}


/* ================================
   AUTO LOAD
================================ */

loadLocation();

</script>

</body>

</html>
