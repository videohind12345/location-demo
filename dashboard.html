```html
<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Live Location Dashboard</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 20px;
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            color: #222;
        }

        .container {
            max-width: 900px;
            margin: auto;
        }

        h1 {
            text-align: center;
            margin-bottom: 20px;
        }

        .card {
            background: white;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 3px 12px rgba(0,0,0,0.08);
        }

        .card h2 {
            margin-top: 0;
        }

        .row {
            padding: 9px 0;

        .row:last-child {

        .label {
            font-weight: bold;

        .good {
            color: green;

        }

        .medium {

            font-weight: bold;
        }

        .poor {
            color: red;
            font-weight: bold;
        }

        .history-item {
            background: #fafafa;
            border: 1px solid #ddd;
            border-radius: 10px;
            padding: 15px;
            margin-bottom: 12px;
        }

        .history-number {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .map-btn {
            display: inline-block;
            margin-top: 10px;
            padding: 10px 14px;
            background: #1976d2;
            color: white;
            text-decoration: none;
            border-radius: 7px;
            font-weight: bold;
        }

        .map-btn:hover {
            background: #125ca1;
        }

        .status {
            text-align: center;
            font-weight: bold;
            margin-bottom: 15px;
        }

        .loading {
            text-align: center;
            color: #666;
        }

        .empty {
            text-align: center;
            padding: 20px;
            color: #777;
        }

        .error {
            background: #ffe5e5;
            color: #b00020;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 15px;
            word-break: break-word;
        }

        .refresh-info {
            text-align: center;
            font-size: 13px;
            color: #666;
            margin-top: 10px;
        }
    </style>

<body>

<div class="container">

    <h1>📍 Live Location Dashboard</h1>

    <div id="status" class="status">
        🔄 Location data loading...
    </div>

    <div id="errorBox"></div>

    <!-- LATEST LOCATION -->
    <div class="card">

        <h2>📍 Latest Location</h2>

        <div id="latestContent">
            <div class="loading">
                Location loading...
            </div>
        </div>

    </div>


    <!-- LOCATION HISTORY -->
    <div class="card">

        <h2>🕘 Location History</h2>

        <div id="historyContent">
            <div class="loading">
                History loading...
            </div>
        </div>

        <div class="refresh-info">
            🔄 Automatically refreshes every 5 seconds
        </div>

    </div>

</div>


<script>

    // ============================================
    // SUPABASE SETTINGS
    // ============================================

    const SUPABASE_URL =
        "https://qtfnupdojsqpuywhoryu.supabase.co";

    const SUPABASE_KEY =
        "sb_publishable_GAsXGjXdKTZxlm5tqx-t0w_96i3RmKE";


    // ============================================
    // DOM ELEMENTS
    // ============================================

    const latestContent =
        document.getElementById("latestContent");

    const historyContent =
        document.getElementById("historyContent");

    const statusBox =
        document.getElementById("status");

    const errorBox =
        document.getElementById("errorBox");


    // ============================================
    // FORMAT TIME
    // ============================================

    function formatTime(dateString) {

        if (!dateString) {
            return "Unknown";
        }

        const date = new Date(dateString);

        if (isNaN(date.getTime())) {
            return dateString;
        }

        return date.toLocaleString("en-IN", {
            dateStyle: "medium",
            timeStyle: "medium"
        });
    }


    // ============================================
    // ACCURACY CLASS
    // ============================================

    function accuracyClass(accuracy) {

        const value = Number(accuracy);

        if (!Number.isFinite(value)) {
            return "";
        }

        if (value <= 20) {
            return "good";
        }

        if (value <= 100) {
            return "medium";
        }

        return "poor";
    }


    // ============================================
    // GOOGLE MAPS LINK
    // ============================================

    function mapLink(latitude, longitude) {

        const lat = Number(latitude);
        const lon = Number(longitude);

        if (!Number.isFinite(lat) ||
            !Number.isFinite(lon)) {

            return "";
        }

        const url =
            "https://www.google.com/maps?q=" +
            encodeURIComponent(lat + "," + lon);

        return `
            <a
                class="map-btn"
                href="${url}"
                target="_blank"
                rel="noopener noreferrer"
            >
                🗺️ Open in Google Maps
            </a>
        `;
    }


    // ============================================
    // LOAD LOCATIONS FROM SUPABASE
    // ============================================

    async function loadLocations() {

        errorBox.innerHTML = "";

        statusBox.innerHTML =
            "🔄 Loading latest location...";

        try {

            const url =
                SUPABASE_URL +
                "/rest/v1/locations" +
                "?select=id,device_id,latitude,longitude,accuracy,city,state,created_at" +
                "&order=created_at.desc" +
                "&limit=100";


            const response = await fetch(url, {

                method: "GET",

                headers: {
                    "apikey": SUPABASE_KEY,
                    "Authorization":
                        "Bearer " + SUPABASE_KEY
                }

            });


            // ====================================
            // CHECK RESPONSE
            // ====================================

            if (!response.ok) {

                const errorText =
                    await response.text();

                throw new Error(
                    "Supabase Error: " +
                    response.status +
                    " - " +
                    errorText
                );
            }


            const data =
                await response.json();


            // ====================================
            // NO DATA
            // ====================================

            if (!Array.isArray(data) ||
                data.length === 0) {

                latestContent.innerHTML = `
                    <div class="empty">
                        📭 अभी कोई location data नहीं मिला।
                    </div>
                `;

                historyContent.innerHTML = `
                    <div class="empty">
                        Location History खाली है।
                    </div>
                `;

                statusBox.innerHTML =
                    "⚠️ No location data found";

                return;
            }


            // ====================================
            // LATEST LOCATION
            // ====================================

            const latest = data[0];

            const latestAccuracy =
                Number(latest.accuracy);


            latestContent.innerHTML = "";


            latestContent.insertAdjacentHTML(
                "beforeend",
                `
                <div class="row">
                    <div class="label">
                        📱 Device:
                    </div>
                    ${latest.device_id || "Unknown"}
                </div>

                <div class="row">
                    <div class="label">
                        🏙️ City:
                    </div>
                    ${latest.city || "उपलब्ध नहीं"}
                </div>

                <div class="row">
                    <div class="label">
                        🗺️ State:
                    </div>
                    ${latest.state || "उपलब्ध नहीं"}
                </div>

                <div class="row">
                    <div class="label">
                        🌐 Latitude:
                    </div>
                    ${latest.latitude}
                </div>

                <div class="row">
                    <div class="label">
                        🌐 Longitude:
                    </div>
                    ${latest.longitude}
                </div>

                <div class="row">
                    <div class="label">
                        🎯 Accuracy:
                    </div>

                    <span class="${accuracyClass(latestAccuracy)}">

                        ${
                            Number.isFinite(latestAccuracy)
                            ? Math.round(latestAccuracy) + " मीटर"
                            : latest.accuracy
                        }

                    </span>
                </div>

                <div class="row">
                    <div class="label">
                        🕐 Created At:
                    </div>

                    ${formatTime(latest.created_at)}
                </div>

                ${mapLink(
                    latest.latitude,
                    latest.longitude
                )}
                `
            );


            // ====================================
            // LOCATION HISTORY
            // ====================================

            historyContent.innerHTML = "";


            data.forEach((location, index) => {

                const accuracy =
                    Number(location.accuracy);


                historyContent.insertAdjacentHTML(
                    "beforeend",
                    `
                    <div class="history-item">

                        <div class="history-number">
                            #${index + 1}
                        </div>

                        <div class="row">

                            <div class="label">
                                📱 Device:
                            </div>

                            ${location.device_id || "Unknown"}

                        </div>


                        <div class="row">

                            <div class="label">
                                🏙️ City:
                            </div>

                            ${location.city || "उपलब्ध नहीं"}

                        </div>


                        <div class="row">

                            <div class="label">
                                🗺️ State:
                            </div>

                            ${location.state || "उपलब्ध नहीं"}

                        </div>


                        <div class="row">

                            <div class="label">
                                🌐 Latitude:
                            </div>

                            ${location.latitude}

                        </div>


                        <div class="row">

                            <div class="label">
                                🌐 Longitude:
                            </div>

                            ${location.longitude}

                        </div>


                        <div class="row">

                            <div class="label">
                                🎯 Accuracy:
                            </div>

                            <span class="${accuracyClass(accuracy)}">

                                ${
                                    Number.isFinite(accuracy)
                                    ? Math.round(accuracy) + " मीटर"
                                    : location.accuracy
                                }

                            </span>

                        </div>


                        <div class="row">

                            <div class="label">
                                🕐 Time:
                            </div>

                            ${formatTime(location.created_at)}

                        </div>


                        ${mapLink(
                            location.latitude,
                            location.longitude
                        )}

                    </div>
                    `
                );

            });


            // ====================================
            // SUCCESS STATUS
            // ====================================

            statusBox.innerHTML =
                "🟢 Location Connected • " +
                data.length +
                " records found";


        } catch (error) {

            console.error(error);

            statusBox.innerHTML =
                "🔴 Location data load failed";


            errorBox.innerHTML = `
                <div class="error">
                    ❌ ${error.message}
                </div>
            `;

        }

    }


    // ============================================
    // FIRST LOAD
    // ============================================

    loadLocations();


    // ============================================
    // AUTO REFRESH EVERY 5 SECONDS
    // ============================================

    setInterval(
        loadLocations,
        5000
    );

</script>

</body>
</html>
