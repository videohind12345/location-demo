<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Latest Shared Location</title>

<style>
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        padding: 20px;
        font-family: Arial, sans-serif;
        background: #f4f7fb;
        color: #222;
    }

    .container {
        max-width: 650px;
        margin: auto;
    }

    .card {
        background: white;
        border-radius: 18px;
        padding: 25px;
        box-shadow: 0 5px 20px rgba(0,0,0,0.10);
    }

    h1 {
        margin-top: 0;
        text-align: center;
        font-size: 28px;
    }

    .status {
        text-align: center;
        padding: 12px;
        border-radius: 10px;
        background: #e9f8ee;
        color: #16803a;
        font-weight: bold;
        margin-bottom: 20px;
    }

    .location-box {
        border: 1px solid #ddd;
        border-radius: 14px;
        padding: 18px;
        margin-top: 15px;
    }

    .row {
        padding: 9px 0;
        border-bottom: 1px solid #eee;
        word-break: break-word;
    }

    .row:last-child {
        border-bottom: none;
    }

    .label {
        font-weight: bold;
    }

    .value {
        margin-top: 4px;
    }

    button {
        width: 100%;
        border: none;
        border-radius: 12px;
        padding: 14px;
        font-size: 17px;
        font-weight: bold;
        cursor: pointer;
        margin-bottom: 12px;
    }

    #refreshBtn {
        background: #1976d2;
        color: white;
    }

    #mapBtn {
        background: #16803a;
        color: white;
        display: none;
    }

    button:disabled {
        opacity: 0.6;
        cursor: not-allowed;
    }

    .error {
        background: #ffecec;
        color: #b00020;
        padding: 14px;
        border-radius: 10px;
        margin-top: 15px;
        display: none;
        white-space: pre-wrap;
        word-break: break-word;
    }

    .updated {
        text-align: center;
        margin-top: 15px;
        color: #666;
        font-size: 14px;
    }

    .accuracy-good {
        color: #16803a;
        font-weight: bold;
    }

    .accuracy-medium {
        color: #d47b00;
        font-weight: bold;
    }

    .accuracy-bad {
        color: #d00000;
        font-weight: bold;
    }
</style>
</head>

<body>

<div class="container">

    <div class="card">

        <h1>📍 Latest Shared Location</h1>

        <div id="status" class="status">
            🔄 Location check की जा रही है...
        </div>

        <button id="refreshBtn">
            🔄 Refresh Location
        </button>

        <button id="mapBtn">
            📍 Open Google Maps
        </button>

        <div id="locationBox" class="location-box" style="display:none;">

            <div class="row">
                <div class="label">📱 Device:</div>
                <div id="device" class="value"></div>
            </div>

            <div class="row">
                <div class="label">🌐 Latitude:</div>
                <div id="latitude" class="value"></div>
            </div>

            <div class="row">
                <div class="label">🌐 Longitude:</div>
                <div id="longitude" class="value"></div>
            </div>

            <div class="row">
                <div class="label">🎯 Accuracy:</div>
                <div id="accuracy" class="value"></div>
            </div>

            <div class="row">
                <div class="label">🕐 Last Updated:</div>
                <div id="updated" class="value"></div>
            </div>

        </div>

        <div id="errorBox" class="error"></div>

        <div class="updated">
            Auto refresh: हर 5 सेकंड
        </div>

    </div>

</div>


<script>

/* ================================
   SUPABASE SETTINGS
================================ */

const SUPABASE_URL =
    "https://qtfnupdojsqpuywhoryu.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_GAsXGjXdKTZxlm5tqx-t0w_96i3RmKE";


/* ================================
   ELEMENTS
================================ */

const statusBox = document.getElementById("status");
const refreshBtn = document.getElementById("refreshBtn");
const mapBtn = document.getElementById("mapBtn");

const locationBox = document.getElementById("locationBox");
const errorBox = document.getElementById("errorBox");

const deviceEl = document.getElementById("device");
const latitudeEl = document.getElementById("latitude");
const longitudeEl = document.getElementById("longitude");
const accuracyEl = document.getElementById("accuracy");
const updatedEl = document.getElementById("updated");


/* ================================
   CURRENT MAP URL
================================ */

let currentLatitude = null;
let currentLongitude = null;


/* ================================
   LOAD LATEST LOCATION
================================ */

async function loadLatestLocation() {

    refreshBtn.disabled = true;

    statusBox.textContent = "🔄 Latest location पढ़ी जा रही है...";
    statusBox.style.background = "#fff7df";
    statusBox.style.color = "#8a6500";

    errorBox.style.display = "none";

    try {

        /*
          हम latest row लेने के लिए
          updated_at DESC कर रहे हैं।
        */

        const url =
            SUPABASE_URL +
            "/rest/v1/locations" +
            "?select=*" +
            "&order=updated_at.desc" +
            "&limit=1";

        const response = await fetch(url, {

            method: "GET",

            headers: {
                "apikey": SUPABASE_KEY,
                "Authorization": "Bearer " + SUPABASE_KEY
            }

        });


        if (!response.ok) {

            const errorText = await response.text();

            throw new Error(
                "Supabase Error " +
                response.status +
                "\n" +
                errorText
            );
        }


        const data = await response.json();


        if (!data || data.length === 0) {

            locationBox.style.display = "none";
            mapBtn.style.display = "none";

            statusBox.textContent =
                "⚠️ अभी कोई location नहीं मिली।";

            statusBox.style.background = "#fff0f0";
            statusBox.style.color = "#b00020";

            refreshBtn.disabled = false;

            return;
        }


        const location = data[0];


        /* ================================
           SHOW DATA
        ================================= */

        const latitude =
            Number(location.latitude);

        const longitude =
            Number(location.longitude);

        const accuracy =
            Number(location.accuracy);


        currentLatitude = latitude;
        currentLongitude = longitude;


        deviceEl.textContent =
            location.device_id || "Unknown";


        latitudeEl.textContent =
            Number.isFinite(latitude)
                ? latitude.toFixed(7)
                : location.latitude;


        longitudeEl.textContent =
            Number.isFinite(longitude)
                ? longitude.toFixed(7)
                : location.longitude;


        if (Number.isFinite(accuracy)) {

            const accuracyRounded =
                Math.round(accuracy);

            accuracyEl.textContent =
                "लगभग " +
                accuracyRounded +
                " मीटर";


            if (accuracyRounded <= 20) {

                accuracyEl.className =
                    "value accuracy-good";

            } else if (accuracyRounded <= 100) {

                accuracyEl.className =
                    "value accuracy-medium";

            } else {

                accuracyEl.className =
                    "value accuracy-bad";
            }

        } else {

            accuracyEl.textContent =
                location.accuracy || "Unknown";

            accuracyEl.className = "value";
        }


        /* ================================
           UPDATED TIME
        ================================= */

        let updatedTime =
            location.updated_at ||
            location.created_at ||
            location.timestamp ||
            location.time;


        if (updatedTime) {

            const date =
                new Date(updatedTime);

            if (!isNaN(date.getTime())) {

                updatedEl.textContent =
                    date.toLocaleString("en-IN");

            } else {

                updatedEl.textContent =
                    updatedTime;
            }

        } else {

            updatedEl.textContent =
                "Time column नहीं मिली";
        }


        /* ================================
           SUCCESS
        ================================= */

        locationBox.style.display = "block";

        mapBtn.style.display = "block";

        statusBox.textContent =
            "🟢 Latest location मिल गई।";

        statusBox.style.background = "#e9f8ee";
        statusBox.style.color = "#16803a";


    } catch (error) {

        console.error(error);

        statusBox.textContent =
            "🔴 Location पढ़ने में समस्या";

        statusBox.style.background = "#ffecec";
        statusBox.style.color = "#b00020";

        errorBox.style.display = "block";

        errorBox.textContent =
            error.message || String(error);

    }


    refreshBtn.disabled = false;
}


/* ================================
   GOOGLE MAPS
================================ */

mapBtn.addEventListener("click", function() {

    if (
        currentLatitude === null ||
        currentLongitude === null
    ) {
        return;
    }

    const mapsUrl =
        "https://www.google.com/maps?q=" +
        encodeURIComponent(currentLatitude) +
        "," +
        encodeURIComponent(currentLongitude);

    window.open(
        mapsUrl,
        "_blank"
    );
});


/* ================================
   MANUAL REFRESH
================================ */

refreshBtn.addEventListener(
    "click",
    loadLatestLocation
);


/* ================================
   FIRST LOAD
================================ */

loadLatestLocation();


/* ================================
   AUTO REFRESH
================================ */

setInterval(
    loadLatestLocation,
    5000
);

</script>

</body>
</html>
