
<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Live Location Dashboard</title>

<style>
* { box-sizing: border-box; }

body {
    margin: 0;
    padding: 20px;
    font-family: Arial, sans-serif;
    background: #f4f6f8;
    color: #222;
}

.container {
    max-width: 900px;
    margin: auto;
}

h1 {
    text-align: center;
    margin-bottom: 20px;
}

.card {
    background: #fff;
    border-radius: 12px;
    padding: 20px;
    margin-bottom: 20px;
    box-shadow: 0 3px 12px rgba(0,0,0,.08);
}

.card h2 { margin-top: 0; }

.row {
    padding: 10px 0;
    border-bottom: 1px solid #eee;
    word-break: break-word;
}

.row:last-child { border-bottom: none; }

.label {
    font-weight: bold;
    margin-bottom: 4px;
}

.phone {
    color: #075cab;
    font-weight: bold;
    font-size: 18px;
}

.good { color: green; font-weight: bold; }
.medium { color: #d68910; font-weight: bold; }
.poor { color: red; font-weight: bold; }

.history-item {
    background: #fafafa;
    border: 1px solid #ddd;
    border-radius: 10px;
    padding: 15px;
    margin-bottom: 12px;
}

.history-number {
    font-size: 18px;
    font-weight: bold;
    margin-bottom: 10px;
}

.map-btn {
    display: inline-block;
    margin-top: 12px;
    padding: 10px 14px;
    background: #1976d2;
    color: white;
    text-decoration: none;
    border-radius: 7px;
    font-weight: bold;
}

.map-btn:hover { background: #125ca1; }

.status {
    text-align: center;
    font-weight: bold;
    margin-bottom: 15px;
}

.loading {
    text-align: center;
    color: #666;
    padding: 15px;
}

.empty {
    text-align: center;
    padding: 20px;
    color: #777;
}

.error {
    background: #ffe5e5;
    color: #b00020;
    padding: 14px;
    border-radius: 8px;
    margin-bottom: 15px;
    word-break: break-word;
}

.refresh-info, .time-info {
    text-align: center;
    font-size: 13px;
    color: #666;
    margin-top: 10px;
}
</style>
</head>

<body>
<div class="container">

<h1>📍 Live Location Dashboard</h1>

<div id="status" class="status">
    🔄 Location data loading...
</div>

<div id="errorBox"></div>

<div class="card">
    <h2>📍 Latest Location</h2>
    <div id="latestContent" class="loading">
        Location loading...
    </div>
</div>

<div class="card">
    <h2>🕘 Location History</h2>
    <div id="historyContent" class="loading">
        History loading...
    </div>
    <div class="refresh-info">
        🔄 Automatically refreshes every 5 seconds
    </div>
    <div id="lastRefresh" class="time-info"></div>
</div>

</div>

<script>
/* SUPABASE SETTINGS */

const SUPABASE_URL =
"https://qtfnupdojsqpuywhoryu.supabase.co";

const SUPABASE_KEY =
"sb_publishable_GAsXGjXdKTZxlm5tqx-t0w_96i3RmKE";


/* DOM ELEMENTS */

const latestContent = document.getElementById("latestContent");
const historyContent = document.getElementById("historyContent");
const statusBox = document.getElementById("status");
const errorBox = document.getElementById("errorBox");
const lastRefresh = document.getElementById("lastRefresh");


/* SAFE HTML TEXT */

function escapeHTML(value) {
    return String(value ?? "").replace(/[&<>"']/g, function(char) {
        return {
            "&": "&amp;",
            "<": "&lt;",
            ">": "&gt;",
            '"': "&quot;",
            "'": "&#39;"
        }[char];
    });
}


/* DATE / TIME */

function formatTime(dateString) {
    if (!dateString) return "Unknown";

    const date = new Date(dateString);

    if (isNaN(date.getTime())) return dateString;

    return date.toLocaleString("en-IN", {
        dateStyle: "medium",
        timeStyle: "medium"
    });
}


/* ACCURACY COLOR */

function accuracyClass(accuracy) {
    const value = Number(accuracy);

    if (!Number.isFinite(value)) return "";
    if (value <= 20) return "good";
    if (value <= 100) return "medium";

    return "poor";
}


/* DISPLAY PHONE NUMBER */

function phoneHTML(phone) {
    const number = String(phone ?? "").trim();

    if (!number) {
        return `
            <span>उपलब्ध नहीं</span>
        `;
    }

    return `
        <span class="phone">${escapeHTML(number)}</span>
    `;
}


/* GOOGLE MAPS LINK */

function mapLink(latitude, longitude) {
    const lat = Number(latitude);
    const lon = Number(longitude);

    if (
        !Number.isFinite(lat) ||
        !Number.isFinite(lon) ||
        latitude === null ||
        longitude === null
    ) {
        return "";
    }

    const url = "https://www.google.com/maps?q=" +
        encodeURIComponent(lat + "," + lon);

    return `
        <a class="map-btn"
           href="${url}"
           target="_blank"
           rel="noopener noreferrer">
           🗺️ Open in Google Maps
        </a>
    `;
}


/* LOCATION DETAILS */

function locationDetails(location, includeDevice) {
    const accuracy = Number(location.accuracy);

    return `
        ${includeDevice ? `
        <div class="row">
            <div class="label">📱 Device ID:</div>
            ${escapeHTML(location.device_id || "Unknown")}
        </div>` : ""}

        <div class="row">
            <div class="label">📞 Mobile Number:</div>
            ${phoneHTML(location.phone_number)}
        </div>

        <div class="row">
            <div class="label">🏙️ City:</div>
            ${escapeHTML(location.city || "उपलब्ध नहीं")}
        </div>

        <div class="row">
            <div class="label">🗺️ State:</div>
            ${escapeHTML(location.state || "उपलब्ध नहीं")}
        </div>

        <div class="row">
            <div class="label">🌐 Latitude:</div>
            ${escapeHTML(location.latitude ?? "उपलब्ध नहीं")}
        </div>

        <div class="row">
            <div class="label">🌐 Longitude:</div>
            ${escapeHTML(location.longitude ?? "उपलब्ध नहीं")}
        </div>

        <div class="row">
            <div class="label">🎯 Accuracy:</div>
            <span class="${accuracyClass(accuracy)}">
                ${
                    Number.isFinite(accuracy)
                    ? Math.round(accuracy) + " मीटर"
                    : escapeHTML(location.accuracy ?? "उपलब्ध नहीं")
                }
            </span>
        </div>

        <div class="row">
            <div class="label">🕐 Time:</div>
            ${escapeHTML(formatTime(location.created_at))}
        </div>

        ${mapLink(location.latitude, location.longitude)}
    `;
}


/* LOAD LOCATIONS */

let loading = false;

async function loadLocations() {
    if (loading) return;
    loading = true;

    try {
        errorBox.innerHTML = "";

        const url =
            SUPABASE_URL +
            "/rest/v1/locations" +
            "?select=id,device_id,phone_number,latitude,longitude,accuracy,city,state,created_at" +
            "&order=created_at.desc" +
            "&limit=100";

        const response = await fetch(url, {
            method: "GET",
            headers: {
                "apikey": SUPABASE_KEY
            }
        });

        const responseText = await response.text();

        if (!response.ok) {
            throw new Error(
                "Supabase Error " +
                response.status + ": " + responseText
            );
        }

        const data = JSON.parse(responseText);

        if (!Array.isArray(data) || data.length === 0) {
            latestContent.innerHTML = `
                <div class="empty">
                    📭 अभी कोई location data नहीं मिला।
                </div>
            `;

            historyContent.innerHTML = `
                <div class="empty">
                    Location History खाली है।
                </div>
            `;

            statusBox.textContent = "⚠️ No location data found";
            lastRefresh.textContent =
                "Last checked: " + formatTime(new Date().toISOString());

            return;
        }

        /* LATEST LOCATION */

        latestContent.innerHTML = locationDetails(data[0], true);

        /* LOCATION HISTORY */

        historyContent.innerHTML = "";

        data.forEach((location, index) => {
            const item = document.createElement("div");
            item.className = "history-item";

            item.innerHTML = `
                <div class="history-number">#${index + 1}</div>
                ${locationDetails(location, true)}
            `;

            historyContent.appendChild(item);
        });

        statusBox.textContent =
            "🟢 Location Connected • " + data.length + " records found";

        lastRefresh.textContent =
            "Last refresh: " + formatTime(new Date().toISOString());

    } catch (error) {
        console.error("LOCATION ERROR:", error);

        statusBox.textContent = "🔴 Location data load failed";

        errorBox.innerHTML = "";

        const errorMessage = document.createElement("div");
        errorMessage.className = "error";
        errorMessage.textContent = "❌ " + error.message;

        errorBox.appendChild(errorMessage);

    } finally {
        loading = false;
    }
}


/* FIRST LOAD AND AUTO REFRESH */

loadLocations();
setInterval(loadLocations, 5000);

</script>
</body>
</html>
