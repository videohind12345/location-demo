<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Madam Live Location Searching</title>

<style>
    body {
        font-family: Arial, sans-serif;
        background: #f4f6f8;
        margin: 0;
        padding: 20px;
        text-align: center;
    }

    h2 {
        margin-bottom: 20px;
    }

    button {
        border: none;
        border-radius: 8px;
        padding: 14px 25px;
        margin: 8px;
        font-size: 17px;
        cursor: pointer;
    }

    #startBtn {
        background: #16a34a;
        color: white;
    }

    #stopBtn {
        background: #dc2626;
        color: white;
    }

    #status {
        margin-top: 20px;
        padding: 15px;
        background: white;
        border-radius: 10px;
        text-align: left;
        line-height: 1.6;
        word-break: break-word;
    }
</style>
</head>

<body>

<h2>📍 Madam Live Location Searching</h2>

<button id="startBtn" onclick="startLocation()">
    ▶ Start Location
</button>

<button id="stopBtn" onclick="stopLocation()">
    ⏹ Stop
</button>

<div id="status">
    Location sharing बंद है।
</div>

<script>

/* =====================================================
   SUPABASE SETTINGS
===================================================== */

const SUPABASE_URL =
"https://qtfnupdojsqpuywhoryu.supabase.co";

const SUPABASE_KEY =
"sb_publishable_GAsXGjXdKTZxlm5tqx-t0w_96i3RmKE";


/* =====================================================
   DEVICE ID
===================================================== */

let deviceId = localStorage.getItem("location_device_id");

if (!deviceId) {

    if (crypto.randomUUID) {
        deviceId = crypto.randomUUID();
    } else {
        deviceId =
            Date.now().toString(36) +
            Math.random().toString(36).substring(2);
    }

    localStorage.setItem("location_device_id", deviceId);
}


/* =====================================================
   VARIABLES
===================================================== */

let watchId = null;
let running = false;

let bestAccuracy = Infinity;
let lastSavedAccuracy = Infinity;

let lastLatitude = null;
let lastLongitude = null;


/* =====================================================
   STATUS
===================================================== */

function setStatus(message) {

    document.getElementById("status").innerHTML = message;
}


/* =====================================================
   START LOCATION
===================================================== */

function startLocation() {

    if (running) {
        return;
    }

    if (!navigator.geolocation) {

        setStatus(
            "❌ यह browser GPS location support नहीं करता।"
        );

        return;
    }

    running = true;

    bestAccuracy = Infinity;
    lastSavedAccuracy = Infinity;

    setStatus(
        "📡 GPS शुरू हो रहा है...<br>" +
        "कृपया खुले स्थान पर 1–3 मिनट फोन को स्थिर रखें।"
    );


    watchId = navigator.geolocation.watchPosition(

        positionSuccess,

        positionError,

        {
            enableHighAccuracy: true,
            maximumAge: 0,
            timeout: 30000
        }

    );
}


/* =====================================================
   GPS SUCCESS
===================================================== */

async function positionSuccess(position) {

    if (!running) {
        return;
    }

    const latitude =
        position.coords.latitude;

    const longitude =
        position.coords.longitude;

    const accuracy =
        position.coords.accuracy;


    /* -----------------------------------------------
       BEST ACCURACY DISPLAY
    ----------------------------------------------- */

    if (accuracy < bestAccuracy) {
        bestAccuracy = accuracy;
    }


    /* -----------------------------------------------
       DO NOT SAVE POOR ACCURACY
    ----------------------------------------------- */

    if (accuracy > 30) {

        setStatus(
            "📡 GPS signal मिल रहा है...<br><br>" +

            "Latitude: " +
            latitude.toFixed(7) +

            "<br>" +

            "Longitude: " +
            longitude.toFixed(7) +

            "<br>" +

            "🎯 Current Accuracy: " +
            Math.round(accuracy) +
            " m" +

            "<br>" +

            "🏆 Best Accuracy: " +
            Math.round(bestAccuracy) +
            " m" +

            "<br><br>" +

            "⏳ Accuracy 30m से बेहतर होने का इंतजार..."
        );

        return;
    }


    /* -----------------------------------------------
       DON'T SAVE SAME/BAD READING REPEATEDLY
    ----------------------------------------------- */

    if (
        accuracy >= lastSavedAccuracy &&
        latitude === lastLatitude &&
        longitude === lastLongitude
    ) {
        return;
    }


    /* -----------------------------------------------
       SAVE LOCATION
    ----------------------------------------------- */

    setStatus(
        "📍 अच्छी GPS accuracy मिल गई!<br>" +
        "⏳ Location save हो रही है...<br><br>" +

        "Accuracy: " +
        Math.round(accuracy) +
        " m"
    );


    try {

        await saveLocation(
            latitude,
            longitude,
            accuracy
        );

        lastSavedAccuracy = accuracy;

        lastLatitude = latitude;
        lastLongitude = longitude;


    } catch (error) {

        setStatus(
            "❌ Location save failed<br><br>" +
            error.message
        );
    }
}


/* =====================================================
   SAVE LOCATION TO SUPABASE
===================================================== */

async function saveLocation(
    latitude,
    longitude,
    accuracy
) {

    let city = "";
    let state = "";


    /* -----------------------------------------------
       REVERSE GEOCODING
    ----------------------------------------------- */

    try {

        const geoUrl =
            "https://api.bigdatacloud.net/data/" +
            "reverse-geocode-client" +
            "?latitude=" + encodeURIComponent(latitude) +
            "&longitude=" + encodeURIComponent(longitude) +
            "&localityLanguage=en";


        const geoResponse =
            await fetch(geoUrl);


        if (geoResponse.ok) {

            const geoData =
                await geoResponse.json();


            city =
                geoData.city ||
                geoData.locality ||
                geoData.principalSubdivision ||
                "";

            state =
                geoData.principalSubdivision ||
                "";

        }

    } catch (geoError) {

        console.log(
            "Reverse geocoding failed:",
            geoError
        );
    }


    /* -----------------------------------------------
       SUPABASE INSERT
    ----------------------------------------------- */

    const url =
        SUPABASE_URL +
        "/rest/v1/locations";


    const response =
        await fetch(url, {

            method: "POST",

            headers: {

                "apikey": SUPABASE_KEY,

                "Content-Type":
                    "application/json",

                "Accept":
                    "application/json",

                "Prefer":
                    "return=representation"

            },

            body: JSON.stringify({

                device_id: deviceId,

                latitude: latitude,

                longitude: longitude,

                accuracy: accuracy,

                city: city,

                state: state

            })

        });


    const responseText =
        await response.text();


    if (!response.ok) {

        throw new Error(
            "Supabase HTTP " +
            response.status +
            "\n" +
            responseText
        );
    }


    setStatus(

        "🟢 Location Successfully Saved!<br><br>" +

        "📍 Latitude: " +
        latitude.toFixed(7) +

        "<br>" +

        "📍 Longitude: " +
        longitude.toFixed(7) +

        "<br>" +

        "🎯 Accuracy: " +
        Math.round(accuracy) +
        " m" +

        "<br>" +

        "🏙️ City: " +
        (city || "Unknown") +

        "<br>" +

        "🗺️ State: " +
        (state || "Unknown") +

        "<br><br>" +

        "📱 Device ID:<br>" +
        deviceId
    );
}


/* =====================================================
   GPS ERROR
===================================================== */

function positionError(error) {

    let message =
        "❌ GPS Error<br><br>";


    if (error.code === 1) {

        message +=
            "Location permission denied.";

    } else if (error.code === 2) {

        message +=
            "Location unavailable.";

    } else if (error.code === 3) {

        message +=
            "GPS timeout. फिर से कोशिश हो रही है.";

    } else {

        message +=
            error.message;
    }


    setStatus(message);
}


/* =====================================================
   STOP LOCATION
===================================================== */

function stopLocation() {

    running = false;


    if (watchId !== null) {

        navigator.geolocation.clearWatch(
            watchId
        );

        watchId = null;
    }


    setStatus(
        "🔴 Location sharing बंद है।"
    );
}

</script>

</body>
</html>
