<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Madam Live Location Searching</title>

<style>

body {
    font-family: Arial, sans-serif;
    background: #f4f6f8;
    margin: 0;
    padding: 20px;
}

.container {
    max-width: 500px;
    margin: auto;
}

.card {
    background: white;
    padding: 25px;
    border-radius: 15px;
    box-shadow: 0 3px 12px rgba(0,0,0,0.10);
}

h2 {
    text-align: center;
    margin-top: 0;
}

button {
    width: 100%;
    padding: 14px;
    margin-top: 10px;
    border: none;
    border-radius: 8px;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
}

.start {
    background: #16a34a;
    color: white;
}

.stop {
    background: #dc2626;
    color: white;
}

.status {
    margin-top: 20px;
    padding: 15px;
    border-radius: 10px;
    background: #f1f5f9;
    line-height: 1.7;
    word-break: break-word;
}

.green {
    color: #15803d;
    font-weight: bold;
}

.orange {
    color: #c2410c;
    font-weight: bold;
}

.red {
    color: #dc2626;
    font-weight: bold;
}

</style>
</head>


<body>

<div class="container">

<div class="card">

<h2>📍 Madam Live Location</h2>

<button
    class="start"
    onclick="startTracking()">
    ▶ Start Location
</button>

<button
    class="stop"
    onclick="stopTracking()">
    ⏹ Stop Location
</button>

<div
    id="status"
    class="status">

    Location tracking बंद है.

</div>

</div>

</div>


<script>

/* ==========================================
   SUPABASE
========================================== */

const SUPABASE_URL =
"https://qtfnupdojsqpuywhoryu.supabase.co";

const SUPABASE_KEY =
"sb_publishable_GAsXGjXdKTZxlm5tqx-t0w_96i3RmKE";


/* ==========================================
   DEVICE ID
========================================== */

let deviceId =
localStorage.getItem("device_id");

if (!deviceId) {

    deviceId =
        crypto.randomUUID();

    localStorage.setItem(
        "device_id",
        deviceId
    );
}


/* ==========================================
   VARIABLES
========================================== */

let watchId = null;

let tracking = false;

let lastSentTime = 0;


/* ==========================================
   STATUS
========================================== */

function showStatus(
    message,
    type = ""
) {

    const box =
        document.getElementById("status");

    box.innerHTML =
        message;

    box.className =
        "status " + type;
}


/* ==========================================
   CITY / STATE
========================================== */

async function getCityState(
    latitude,
    longitude
) {

    try {

        const url =
            "https://api.bigdatacloud.net/data/" +
            "reverse-geocode-client" +
            "?latitude=" +
            latitude +
            "&longitude=" +
            longitude +
            "&localityLanguage=en";


        const response =
            await fetch(url);


        if (!response.ok) {

            return {
                city: "",
                state: ""
            };
        }


        const data =
            await response.json();


        return {

            city:
                data.city ||
                data.locality ||
                "",

            state:
                data.principalSubdivision ||
                ""
        };


    } catch (error) {

        console.log(
            "City/State error:",
            error
        );

        return {
            city: "",
            state: ""
        };
    }
}


/* ==========================================
   SEND LOCATION
========================================== */

async function sendLocation(
    latitude,
    longitude,
    accuracy
) {

    try {

        showStatus(
            `
            📡 GPS location मिल गई...<br><br>

            Latitude:
            ${latitude}<br>

            Longitude:
            ${longitude}<br>

            🎯 Accuracy:
            ${accuracy.toFixed(1)} m<br><br>

            ⏳ Server पर भेजी जा रही है...
            `,
            "orange"
        );


        /* City / State */

        const location =
            await getCityState(
                latitude,
                longitude
            );


        /* Data */

        const payload = {

            device_id:
                deviceId,

            latitude:
                latitude,

            longitude:
                longitude,

            accuracy:
                accuracy,

            city:
                location.city,

            state:
                location.state
        };


        /* Supabase */

        const response =
            await fetch(
                SUPABASE_URL +
                "/rest/v1/locations",
                {

                    method: "POST",

                    headers: {

                        "apikey":
                            SUPABASE_KEY,

                        "Content-Type":
                            "application/json",

                        "Accept":
                            "application/json",

                        "Prefer":
                            "return=minimal"
                    },

                    body:
                        JSON.stringify(
                            payload
                        )
                }
            );


        if (!response.ok) {

            const errorText =
                await response.text();

            throw new Error(
                response.status +
                " " +
                errorText
            );
        }


        showStatus(
            `
            <span class="green">
            ✅ Location server पर भेज दी गई
            </span>

            <br><br>

            📍 Latitude:
            ${latitude}<br>

            📍 Longitude:
            ${longitude}<br>

            🎯 Accuracy:
            ${accuracy.toFixed(1)} m<br>

            🏙️ City:
            ${location.city || "-"}<br>

            🗺️ State:
            ${location.state || "-"}<br><br>

            🟢 Live tracking चालू है...
            `,
            "green"
        );


    } catch (error) {

        console.error(
            "Server error:",
            error
        );


        showStatus(
            `
            📡 GPS tracking चालू है.<br><br>

            ⚠️ अभी server पर location भेजने में
            समस्या आई है.<br><br>

            अगली GPS reading पर फिर कोशिश होगी.
            `,
            "orange"
        );
    }
}


/* ==========================================
   GPS SUCCESS
========================================== */

function gpsSuccess(
    position
) {

    const latitude =
        position.coords.latitude;

    const longitude =
        position.coords.longitude;

    const accuracy =
        position.coords.accuracy;


    /*
       हर GPS reading को server पर
       लगातार नहीं भेजना है।

       कम से कम 10 सेकंड का gap.
    */

    const now =
        Date.now();


    if (
        now - lastSentTime <
        10000
    ) {

        showStatus(
            `
            🟢 GPS tracking चालू है...<br><br>

            Latitude:
            ${latitude}<br>

            Longitude:
            ${longitude}<br>

            🎯 Current Accuracy:
            ${accuracy.toFixed(1)} m
            `,
            "green"
        );

        return;
    }


    lastSentTime =
        now;


    sendLocation(
        latitude,
        longitude,
        accuracy
    );
}


/* ==========================================
   GPS ERROR
========================================== */

function gpsError(
    error
) {

    console.log(
        "GPS Error:",
        error
    );


    if (
        error.code === 1
    ) {

        showStatus(
            `
            ❌ Location permission denied.<br><br>

            कृपया phone में Location Permission
            Allow करें.
            `,
            "red"
        );

    }

    else if (
        error.code === 2
    ) {

        showStatus(
            `
            ⚠️ GPS location अभी नहीं मिल रही.<br><br>

            Phone की Location/GPS ON रखें.
            `,
            "orange"
        );

    }

    else if (
        error.code === 3
    ) {

        showStatus(
            `
            ⚠️ GPS timeout.<br><br>

            GPS फिर से location लेने की कोशिश कर रहा है...
            `,
            "orange"
        );

    }

    else {

        showStatus(
            `
            ❌ GPS Error:<br>
            ${error.message}
            `,
            "red"
        );
    }
}


/* ==========================================
   START
========================================== */

function startTracking() {

    if (
        !navigator.geolocation
    ) {

        showStatus(
            "❌ इस device में GPS supported नहीं है.",
            "red"
        );

        return;
    }


    if (
        tracking
    ) {

        return;
    }


    tracking =
        true;


    lastSentTime =
        0;


    showStatus(
        `
        📡 GPS signal खोजा जा रहा है...<br><br>

        कृपया Location Permission Allow रखें.
        `,
        "orange"
    );


    watchId =
        navigator.geolocation.watchPosition(

            gpsSuccess,

            gpsError,

            {

                enableHighAccuracy:
                    true,

                maximumAge:
                    0,

                timeout:
                    15000
            }
        );
}


/* ==========================================
   STOP
========================================== */

function stopTracking() {

    if (
        watchId !== null
    ) {

        navigator.geolocation.clearWatch(
            watchId
        );

        watchId =
            null;
    }


    tracking =
        false;


    showStatus(
        "⏹ Location tracking बंद कर दी गई है.",
        ""
    );
}


</script>

</body>
</html>
