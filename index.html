<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Madam Live Location Searching</title>

<style>

body {
    font-family: Arial, sans-serif;
    background: #f4f6f8;
    margin: 0;
    padding: 20px;
    text-align: center;
}

h2 {
    margin-bottom: 20px;
}

button {
    border: none;
    border-radius: 8px;
    padding: 14px 25px;
    margin: 8px;
    font-size: 17px;
    cursor: pointer;
}

#startBtn {
    background: #16a34a;
    color: white;
}

#stopBtn {
    background: #dc2626;
    color: white;
}

#status {
    margin-top: 20px;
    padding: 18px;
    background: white;
    border-radius: 10px;
    text-align: left;
    line-height: 1.7;
    word-break: break-word;
}

.good {
    color: #15803d;
    font-weight: bold;
}

.waiting {
    color: #b45309;
    font-weight: bold;
}

.error {
    color: #dc2626;
    font-weight: bold;
}

</style>

</head>


<body>

<h2>📍 Madam Live Location Searching</h2>

<button id="startBtn" onclick="startLocation()">
    ▶ Start Location
</button>

<button id="stopBtn" onclick="stopLocation()">
    ⏹ Stop
</button>


<div id="status">
    🔴 Location sharing बंद है।
</div>


<script>


/* =====================================================
   SUPABASE
===================================================== */

const SUPABASE_URL =
"https://qtfnupdojsqpuywhoryu.supabase.co";

const SUPABASE_KEY =
"sb_publishable_GAsXGjXdKTZxlm5tqx-t0w_96i3RmKE";


/* =====================================================
   SETTINGS
===================================================== */

/*
   इस accuracy से खराब reading server पर save नहीं होगी.
*/

const MAX_SAVE_ACCURACY = 30;


/*
   GPS को लगातार बेहतर accuracy खोजने देंगे.
*/

const GPS_TIMEOUT = 30000;


/* =====================================================
   DEVICE ID
===================================================== */

let deviceId =
    localStorage.getItem("location_device_id");


if (!deviceId) {

    if (
        typeof crypto !== "undefined" &&
        crypto.randomUUID
    ) {

        deviceId =
            crypto.randomUUID();

    } else {

        deviceId =
            Date.now().toString(36) +
            "-" +
            Math.random()
                .toString(36)
                .substring(2);
    }

    localStorage.setItem(
        "location_device_id",
        deviceId
    );
}


/* =====================================================
   VARIABLES
===================================================== */

let watchId = null;

let running = false;


/*
   अब तक मिली सबसे अच्छी GPS accuracy.
*/

let bestAccuracy = Infinity;


/*
   Server पर आखिरी बार save हुई accuracy.
*/

let savedBestAccuracy = Infinity;


/*
   आखिरी saved coordinates.
*/

let savedLatitude = null;
let savedLongitude = null;


/*
   Reverse geocoding को बार-बार करने से बचाने के लिए.
*/

let lastGeoLatitude = null;
let lastGeoLongitude = null;


/* =====================================================
   STATUS FUNCTION
===================================================== */

function setStatus(html) {

    document.getElementById(
        "status"
    ).innerHTML = html;
}


/* =====================================================
   START
===================================================== */

function startLocation() {

    if (running) {

        setStatus(
            "🟢 Location tracking पहले से चालू है।"
        );

        return;
    }


    if (!navigator.geolocation) {

        setStatus(
            '<div class="error">' +
            '❌ यह browser GPS location support नहीं करता।' +
            '</div>'
        );

        return;
    }


    running = true;

    bestAccuracy = Infinity;

    savedBestAccuracy = Infinity;

    savedLatitude = null;

    savedLongitude = null;


    setStatus(
        '<div class="waiting">' +
        '📡 GPS शुरू हो रहा है...<br><br>' +
        '</div>' +

        'कृपया फोन को खुले स्थान पर रखें।<br>' +
        'GPS बेहतर accuracy खोज रहा है...'
    );


    watchId =
        navigator.geolocation.watchPosition(

            handlePosition,

            handlePositionError,

            {

                enableHighAccuracy: true,

                maximumAge: 0,

                timeout: GPS_TIMEOUT

            }

        );
}


/* =====================================================
   GPS POSITION
===================================================== */

async function handlePosition(position) {

    if (!running) {
        return;
    }


    const latitude =
        position.coords.latitude;

    const longitude =
        position.coords.longitude;

    const accuracy =
        position.coords.accuracy;


    /*
       Best accuracy update.
    */

    if (accuracy < bestAccuracy) {

        bestAccuracy = accuracy;
    }


    /*
       अगर accuracy खराब है,
       तो server पर save नहीं करेंगे.
    */

    if (accuracy > MAX_SAVE_ACCURACY) {

        setStatus(

            '<div class="waiting">' +
            '📡 GPS accuracy improve हो रही है...' +
            '</div>' +

            '<br>' +

            '🌐 Latitude: ' +
            latitude.toFixed(7) +

            '<br>' +

            '🌐 Longitude: ' +
            longitude.toFixed(7) +

            '<br>' +

            '🎯 Current Accuracy: ' +
            Math.round(accuracy) +
            ' m' +

            '<br>' +

            '🏆 Best Accuracy: ' +
            Math.round(bestAccuracy) +
            ' m' +

            '<br><br>' +

            '⏳ 30m या उससे बेहतर accuracy का इंतजार...'
        );

        return;
    }


    /*
       अगर यह accuracy पहले से saved
       accuracy से बेहतर नहीं है,
       तो दोबारा save नहीं करेंगे.
    */

    if (accuracy >= savedBestAccuracy) {

        setStatus(

            '<div class="good">' +
            '🟢 Best location पहले से save है।' +
            '</div>' +

            '<br>' +

            '🎯 Current Accuracy: ' +
            Math.round(accuracy) +
            ' m' +

            '<br>' +

            '🏆 Saved Best Accuracy: ' +
            Math.round(savedBestAccuracy) +
            ' m' +

            '<br><br>' +

            '📡 GPS अभी भी बेहतर signal खोज रहा है...'
        );

        return;
    }


    /*
       नई best accuracy मिली.
    */

    setStatus(

        '<div class="good">' +
        '🎯 नई BEST GPS accuracy मिली!' +
        '</div>' +

        '<br>' +

        'Accuracy: ' +
        Math.round(accuracy) +
        ' m' +

        '<br><br>' +

        '⏳ Location server पर save हो रही है...'
    );


    try {

        await saveLocation(

            latitude,
            longitude,
            accuracy

        );


        /*
           Save successful होने के बाद
           best saved accuracy update करें.
        */

        savedBestAccuracy =
            accuracy;

        savedLatitude =
            latitude;

        savedLongitude =
            longitude;


    } catch (error) {

        setStatus(

            '<div class="error">' +
            '❌ Location save failed' +
            '</div>' +

            '<br>' +

            error.message
        );
    }
}


/* =====================================================
   SAVE LOCATION
===================================================== */

async function saveLocation(

    latitude,
    longitude,
    accuracy

) {


    let city = "";

    let state = "";


    /* =================================================
       REVERSE GEOCODING
    ================================================= */

    try {

        /*
           अगर coordinates बहुत ज्यादा
           change नहीं हुए हैं तो पुराना
           city/state reuse कर सकते हैं.
        */

        const geoUrl =

            "https://api.bigdatacloud.net/data/" +

            "reverse-geocode-client" +

            "?latitude=" +
            encodeURIComponent(latitude) +

            "&longitude=" +
            encodeURIComponent(longitude) +

            "&localityLanguage=en";


        const geoResponse =
            await fetch(geoUrl);


        if (geoResponse.ok) {

            const geoData =
                await geoResponse.json();


            city =
                geoData.city ||
                geoData.locality ||
                geoData.localityInfo?.administrative?.[2]?.name ||
                geoData.principalSubdivision ||
                "";


            state =
                geoData.principalSubdivision ||
                "";
        }


    } catch (error) {

        console.log(
            "Reverse geocoding error:",
            error
        );
    }


    /* =================================================
       SUPABASE INSERT
    ================================================= */

    const url =

        SUPABASE_URL +
        "/rest/v1/locations";


    const response =

        await fetch(

            url,

            {

                method: "POST",

                headers: {

                    "apikey":
                        SUPABASE_KEY,

                    "Content-Type":
                        "application/json",

                    "Accept":
                        "application/json",

                    "Prefer":
                        "return=representation"

                },


                body:

                    JSON.stringify({

                        device_id:
                            deviceId,

                        latitude:
                            latitude,

                        longitude:
                            longitude,

                        accuracy:
                            accuracy,

                        city:
                            city,

                        state:
                            state

                    })

            }
        );


    const responseText =
        await response.text();


    if (!response.ok) {

        throw new Error(

            "Supabase HTTP " +
            response.status +

            "<br><br>" +

            responseText

        );
    }


    /* =================================================
       SUCCESS
    ================================================= */

    setStatus(

        '<div class="good">' +
        '✅ BEST LOCATION SERVER पर SAVE हो गई' +
        '</div>' +

        '<br>' +

        '📱 Device ID:<br>' +
        deviceId +

        '<br><br>' +

        '🌐 Latitude: ' +
        latitude.toFixed(7) +

        '<br>' +

        '🌐 Longitude: ' +
        longitude.toFixed(7) +

        '<br>' +

        '🏙️ City: ' +
        (city || "Unknown") +

        '<br>' +

        '🗺️ State: ' +
        (state || "Unknown") +

        '<br>' +

        '🎯 Accuracy: ' +
        Math.round(accuracy) +
        ' m' +

        '<br>' +

        '🏆 Best Accuracy: ' +
        Math.round(
            Math.min(
                accuracy,
                bestAccuracy
            )
        ) +
        ' m' +

        '<br><br>' +

        '📡 GPS अभी भी बेहतर accuracy खोज रहा है...'
    );
}


/* =====================================================
   GPS ERROR
===================================================== */

function handlePositionError(error) {


    let message = "";


    if (error.code === 1) {

        message =
            "❌ Location permission denied.";

    }

    else if (error.code === 2) {

        message =
            "❌ Location unavailable.";

    }

    else if (error.code === 3) {

        message =
            "⏳ GPS timeout. फिर से कोशिश हो रही है...";

    }

    else {

        message =
            "❌ GPS Error: " +
            error.message;
    }


    setStatus(
        '<div class="error">' +
        message +
        '</div>'
    );
}


/* =====================================================
   STOP
===================================================== */

function stopLocation() {

    running = false;


    if (watchId !== null) {

        navigator.geolocation.clearWatch(
            watchId
        );

        watchId = null;
    }


    setStatus(

        '<div class="error">' +
        '🔴 Location sharing बंद है।' +
        '</div>' +

        '<br>' +

        '📱 Device ID:<br>' +
        deviceId
    );
}


</script>

</body>
</html>
