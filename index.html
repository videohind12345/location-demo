<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Live Location Share</title>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#f2f4f7;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
}

.card{
    width:92%;
    max-width:430px;
    background:#ffffff;
    padding:25px;
    border-radius:20px;
    box-shadow:0 5px 25px rgba(0,0,0,.15);
    text-align:center;
}

h2{
    margin:0 0 10px;
}

p{
    color:#555;
    line-height:1.5;
}

button{
    width:100%;
    padding:15px;
    margin-top:12px;
    border:0;
    border-radius:12px;
    font-size:17px;
    cursor:pointer;
}

.location{
    background:#16a34a;
    color:white;
}

.stop{
    background:#dc2626;
    color:white;
}

#result{
    margin-top:20px;
    padding:15px;
    background:#f3f4f6;
    border-radius:12px;
    text-align:left;
    line-height:1.7;
    word-break:break-word;
}

.small{
    font-size:13px;
    color:#666;
    margin-top:12px;
}
</style>
</head>

<body>

<div class="card">

    <h2>📍 Live Location Share</h2>

    <p>
        अपनी location share करने के लिए
        नीचे बटन दबाएँ।
    </p>

    <button
        id="startBtn"
        class="location"
        type="button">
        📍 Share My Location
    </button>

    <button
        id="stopBtn"
        class="stop"
        type="button">
        ⛔ Stop Sharing
    </button>

    <div id="result">
        Location sharing अभी बंद है।
    </div>

    <div class="small">
        Location केवल आपकी अनुमति के बाद इस्तेमाल होगी।
    </div>

</div>


<script>

/* =====================================================
   SUPABASE SETTINGS
   ===================================================== */

const SUPABASE_URL =
"https://qtfnupdojsqpuywhoryu.supabase.co";

const SUPABASE_KEY =
"sb_publishable_GAsXGjXdKTZxlm5tqx-t0w_96i3RmKE";


/* =====================================================
   ELEMENTS
   ===================================================== */

const result =
    document.getElementById("result");

const startBtn =
    document.getElementById("startBtn");

const stopBtn =
    document.getElementById("stopBtn");


/* =====================================================
   DEVICE ID
   ===================================================== */

function getDeviceId(){

    let id =
        localStorage.getItem("location_device_id");

    if(id){
        return id;
    }

    /*
       crypto.randomUUID उपलब्ध न होने की स्थिति में
       fallback ID बनाई जाएगी।
    */

    if(
        window.crypto &&
        typeof crypto.randomUUID === "function"
    ){

        id = crypto.randomUUID();

    }else{

        id =
            "device-" +
            Date.now() +
            "-" +
            Math.random()
                .toString(36)
                .substring(2,10);
    }

    localStorage.setItem(
        "location_device_id",
        id
    );

    return id;
}


const deviceId =
    getDeviceId();


/* =====================================================
   LOCATION STATE
   ===================================================== */

let watchId = null;

let sending = false;

let lastSentLatitude = null;

let lastSentLongitude = null;


/* =====================================================
   START LOCATION
   ===================================================== */

function startLocation(){

    /*
       Button click होते ही तुरंत message बदलें।
       इससे पता चल जाएगा कि JavaScript चल रही है।
    */

    result.innerHTML =
        "⏳ Location शुरू की जा रही है...";


    /*
       Browser support check
    */

    if(!navigator.geolocation){

        result.innerHTML =
            "❌ इस browser में Location उपलब्ध नहीं है।";

        return;
    }


    /*
       HTTPS check
    */

    if(
        window.isSecureContext === false
    ){

        result.innerHTML =
            "❌ Location के लिए HTTPS जरूरी है।";

        return;
    }


    /*
       अगर पहले से चल रही है तो
       दूसरा watcher न बनाएँ।
    */

    if(watchId !== null){

        result.innerHTML =
            "🟢 Location sharing पहले से चालू है।";

        return;
    }


    result.innerHTML =
        "⏳ Location permission माँगी जा रही है...";


    /*
       Current location पहले प्राप्त करें।
       इसके बाद continuous watch शुरू करेंगे।
    */

    navigator.geolocation.getCurrentPosition(

        function(position){

            handleLocation(position);

            startWatching();

        },

        function(error){

            showLocationError(error);

        },

        {

            enableHighAccuracy:true,

            timeout:20000,

            maximumAge:0
        }
    );
}


/* =====================================================
   START CONTINUOUS WATCH
   ===================================================== */

function startWatching(){

    if(watchId !== null){
        return;
    }


    watchId =
        navigator.geolocation.watchPosition(

            function(position){

                handleLocation(position);

            },

            function(error){

                showLocationError(error);

            },

            {

                enableHighAccuracy:true,

                timeout:20000,

                maximumAge:5000
            }
        );
}


/* =====================================================
   HANDLE LOCATION
   ===================================================== */

function handleLocation(position){

    const latitude =
        position.coords.latitude;

    const longitude =
        position.coords.longitude;

    const accuracy =
        position.coords.accuracy;


    /*
       पहले स्क्रीन पर location दिखाएँ।
       Server response का इंतजार नहीं करेंगे।
    */

    result.innerHTML =

        "🟢 <b>Location sharing चालू है।</b><br><br>" +

        "📍 Latitude: " +
        latitude +
        "<br>" +

        "📍 Longitude: " +
        longitude +
        "<br>" +

        "🎯 Accuracy: लगभग " +
        Math.round(accuracy) +
        " मीटर<br><br>" +

        "📡 Location server पर save/update हो रही है...";


    /*
       अगर location बिल्कुल वही है
       तो बार-बार database request न भेजें।
    */

    if(
        lastSentLatitude === latitude &&
        lastSentLongitude === longitude
    ){

        return;
    }


    sendLocation(
        latitude,
        longitude,
        accuracy
    );
}


/* =====================================================
   SEND LOCATION - UPSERT
   ===================================================== */

async function sendLocation(
    latitude,
    longitude,
    accuracy
){

    /*
       एक समय में multiple requests रोकें।
    */

    if(sending){
        return;
    }

    sending = true;


    try{

        /*
           device_id UNIQUE है।
           on_conflict=device_id के कारण:

           नया device  -> INSERT
           पुराना device -> UPDATE
        */

        const url =
            SUPABASE_URL +
            "/rest/v1/locations" +
            "?on_conflict=device_id";


        const response =
            await fetch(

                url,

                {

                    method:"POST",

                    headers:{

                        "apikey":
                            SUPABASE_KEY,

                        "Authorization":
                            "Bearer " +
                            SUPABASE_KEY,

                        "Content-Type":
                            "application/json",

                        "Prefer":
                            "resolution=merge-duplicates,return=minimal"
                    },

                    body:JSON.stringify({

                        device_id:
                            deviceId,

                        latitude:
                            latitude,

                        longitude:
                            longitude,

                        accuracy:
                            accuracy
                    })
                }
            );


        if(!response.ok){

            const errorText =
                await response.text();

            console.error(
                "Supabase Error:",
                errorText
            );


            result.innerHTML =

                "🟢 <b>Location मिल गई है।</b><br><br>" +

                "Latitude: " +
                latitude +
                "<br>" +

                "Longitude: " +
                longitude +
                "<br>" +

                "Accuracy: लगभग " +
                Math.round(accuracy) +
                " मीटर<br><br>" +

                "⚠️ Database में save/update नहीं हो सकी।<br><br>" +

                "<small>" +
                errorText +
                "</small>";


            sending = false;

            return;
        }


        /*
           सफल request के बाद last location याद रखें।
        */

        lastSentLatitude =
            latitude;

        lastSentLongitude =
            longitude;


        result.innerHTML =

            "🟢 <b>Location sharing चालू है।</b><br><br>" +

            "📍 Latitude: " +
            latitude +
            "<br>" +

            "📍 Longitude: " +
            longitude +
            "<br>" +

            "🎯 Accuracy: लगभग " +
            Math.round(accuracy) +
            " मीटर<br><br>" +

            "✅ Location server पर save/update हो गई।";


    }catch(error){

        console.error(
            "Network Error:",
            error
        );


        result.innerHTML =

            "🟢 <b>Location मिल गई है।</b><br><br>" +

            "Latitude: " +
            latitude +
            "<br>" +

            "Longitude: " +
            longitude +
            "<br><br>" +

            "⚠️ Internet/server connection की समस्या।";

    }


    sending = false;
}


/* =====================================================
   LOCATION ERROR
   ===================================================== */

function showLocationError(error){

    let message =
        "Location प्राप्त नहीं हो सकी।";


    if(error.code === 1){

        message =
            "Location permission deny कर दी गई है।";


    }else if(error.code === 2){

        message =
            "Location उपलब्ध नहीं है। फोन की Location ON करें।";


    }else if(error.code === 3){

        message =
            "Location प्राप्त करने में timeout हुआ।";


    }else if(error.message){

        message =
            error.message;
    }


    result.innerHTML =
        "❌ " + message;
}


/* =====================================================
   STOP LOCATION
   ===================================================== */

function stopLocation(){

    if(watchId !== null){

        navigator.geolocation.clearWatch(
            watchId
        );

        watchId = null;
    }


    sending = false;


    result.innerHTML =
        "🔴 Location sharing बंद कर दी गई।";
}


/* =====================================================
   BUTTON EVENTS
   ===================================================== */

startBtn.addEventListener(
    "click",
    startLocation
);


stopBtn.addEventListener(
    "click",
    stopLocation
);


/* =====================================================
   INITIAL STATUS
   ===================================================== */

console.log(
    "Location Demo Started"
);

console.log(
    "Device ID:",
    deviceId
);

</script>

</body>
</html>
