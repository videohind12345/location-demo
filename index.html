<!DOCTYPE html>
<html lang="hi">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Live Location Share</title>

<style>

*{
box-sizing:border-box;
}

body{
margin:0;
font-family:Arial,sans-serif;
background:#f2f4f7;
min-height:100vh;
display:flex;
align-items:center;
justify-content:center;
}

.card{
width:92%;
max-width:430px;
background:#fff;
padding:25px;
border-radius:20px;
box-shadow:0 5px 25px rgba(0,0,0,.15);
text-align:center;
}

h2{
margin:0 0 10px;
}

p{
color:#555;
line-height:1.5;
}

button{
width:100%;
padding:15px;
margin-top:12px;
border:0;
border-radius:12px;
font-size:17px;
cursor:pointer;
}

button:disabled{
opacity:.6;
cursor:not-allowed;
}

.location{
background:#16a34a;
color:#fff;
}

.stop{
background:#dc2626;
color:#fff;
}

#result{
margin-top:20px;
padding:15px;
background:#f3f4f6;
border-radius:12px;
text-align:left;
line-height:1.6;
word-break:break-word;
}

.counter{
margin-top:15px;
font-size:20px;
font-weight:bold;
}

.status{
margin-top:10px;
font-size:14px;
color:#666;
}

</style>

</head>

<body>

<div class="card">

<h2>📍 Live Location Share</h2>

<p>
अपनी location share करने के लिए नीचे बटन दबाएँ।
</p>

<button
id="startButton"
class="location"
onclick="startLocation()">

📍 Share My Location

</button>

<button
id="stopButton"
class="stop"
onclick="stopLocation()">

⛔ Stop Sharing

</button>

<div class="counter" id="counter">
0 / 50
</div>

<div class="status" id="status">
Location sharing बंद है।
</div>

<div id="result">

Location sharing अभी बंद है।

</div>

</div>


<script>

/* =================================================
SUPABASE SETTINGS
================================================= */

const SUPABASE_URL =
"https://qtfnupdojsqpuywhoryu.supabase.co";

const SUPABASE_KEY =
"sb_publishable_GAsXGjXdKTZxlm5tqx-t0w_96i3RmKE";


/* =================================================
DEVICE ID
================================================= */

let deviceId =
localStorage.getItem("location_device_id");

if(!deviceId){

deviceId = crypto.randomUUID();

localStorage.setItem(
"location_device_id",
deviceId
);

}


/* =================================================
LOCATION SETTINGS
================================================= */

const MAX_LOCATIONS = 50;

/*
हर कितने milliseconds में
नई location लेने की कोशिश करनी है।

5000 = 5 seconds
*/

const LOCATION_INTERVAL = 5000;


/* =================================================
VARIABLES
================================================= */

let locationCount = 0;

let isSharing = false;

let locationTimer = null;

let isGettingLocation = false;


/* =================================================
START LOCATION
================================================= */

function startLocation(){

const result =
document.getElementById("result");

const status =
document.getElementById("status");

const startButton =
document.getElementById("startButton");


/* Browser support */

if(!navigator.geolocation){

result.innerHTML =
"❌ इस browser में Location उपलब्ध नहीं है।";

return;

}


/* HTTPS check */

if(
location.protocol !== "https:" &&
location.hostname !== "localhost"
){

result.innerHTML =
"❌ Location के लिए HTTPS connection जरूरी है।";

return;

}


/* Already sharing */

if(isSharing){

result.innerHTML =
"🟢 Location sharing पहले से चालू है।";

return;

}


/* Reset */

locationCount = 0;

document.getElementById("counter").innerText =
"0 / 50";

isSharing = true;

startButton.disabled = true;

status.innerText =
"🟢 Location sharing चालू है।";


result.innerHTML =
"⏳ Location permission माँगी जा रही है...";


/*
पहली location तुरंत लें
*/

getAndSendLocation();


/*
इसके बाद हर 5 सेकंड में
नई location लेने की कोशिश करें।
*/

locationTimer =
setInterval(

function(){

if(
isSharing &&
locationCount < MAX_LOCATIONS
){

getAndSendLocation();

}

},

LOCATION_INTERVAL

);

}


/* =================================================
GET LOCATION + SEND
================================================= */

function getAndSendLocation(){

if(!isSharing){

return;

}


/*
एक ही समय पर दो GPS requests
न चलें।
*/

if(isGettingLocation){

return;

}

if(locationCount >= MAX_LOCATIONS){

finishLocationSharing();

return;

}

isGettingLocation = true;


document.getElementById("status").innerText =
"📡 नई location प्राप्त की जा रही है...";


navigator.geolocation.getCurrentPosition(

async function(position){

isGettingLocation = false;


if(!isSharing){

return;

}


/* GPS DATA */

const latitude =
position.coords.latitude;

const longitude =
position.coords.longitude;

const accuracy =
position.coords.accuracy;


/*
पहले Supabase में भेजें।
Counter तभी बढ़ेगा जब server
success response देगा।
*/

const success =
await sendLocation(
latitude,
longitude,
accuracy
);


if(success){

locationCount++;


/* Counter */

document.getElementById("counter").innerText =
locationCount + " / " + MAX_LOCATIONS;


/* Status */

document.getElementById("status").innerText =
"🟢 Location sharing चालू है।";


/* Result */

document.getElementById("result").innerHTML =

"🟢 Location sharing चालू है।<br><br>" +

"Latitude: " +
latitude +

"<br>" +

"Longitude: " +
longitude +

"<br>" +

"Accuracy: लगभग " +
Math.round(accuracy) +
" मीटर<br><br>" +

"📡 Location server पर भेजी गई।<br>" +

"📍 Update: " +
locationCount +
" / " +
MAX_LOCATIONS;


/*
50 successful locations पूरी
*/

if(
locationCount >= MAX_LOCATIONS
){

finishLocationSharing();

}

}

},

function(error){

isGettingLocation = false;

let message =
"Location नहीं मिली।";


if(error.code === 1){

message =
"Location permission deny कर दी गई।";

}

else if(error.code === 2){

message =
"Location उपलब्ध नहीं है।";

}

else if(error.code === 3){

message =
"Location प्राप्त करने में timeout हुआ।";

}


document.getElementById("status").innerText =
"⚠️ Location प्राप्त नहीं हुई।";


document.getElementById("result").innerHTML =

"⚠️ " +
message +

"<br><br>" +

"अगली कोशिश थोड़ी देर में की जाएगी।";


/*
Permission denied होने पर
बार-बार request नहीं करेंगे।
*/

if(error.code === 1){

stopLocation();

}

},

{

enableHighAccuracy:true,

timeout:15000,

maximumAge:0

}

);

}


/* =================================================
SEND LOCATION TO SUPABASE
================================================= */

async function sendLocation(
latitude,
longitude,
accuracy
){

try{

const response =
await fetch(

SUPABASE_URL +
"/rest/v1/locations",

{

method:"POST",

headers:{

"apikey":
SUPABASE_KEY,

"Authorization":
"Bearer " +
SUPABASE_KEY,

"Content-Type":
"application/json",

"Prefer":
"return=minimal"

},

body:JSON.stringify({

device_id:
deviceId,

latitude:
latitude,

longitude:
longitude,

accuracy:
accuracy

})

}

);


/* Server response */

if(!response.ok){

const errorText =
await response.text();

console.log(
"Supabase Error:",
errorText
);

document.getElementById("status").innerText =
"⚠️ Server error";


document.getElementById("result").innerHTML +=

"<br><br>" +

"⚠️ Server पर location भेजने में समस्या।";


return false;

}


/*
Successfully saved
*/

return true;

}

catch(error){

console.log(
"Network Error:",
error
);


document.getElementById("status").innerText =
"⚠️ Internet समस्या";


document.getElementById("result").innerHTML +=

"<br><br>" +

"⚠️ Internet connection की समस्या।";


return false;

}

}


/* =================================================
FINISH AFTER 50
================================================= */

function finishLocationSharing(){

isSharing = false;

isGettingLocation = false;


/* Timer बंद */

if(locationTimer !== null){

clearInterval(locationTimer);

locationTimer = null;

}


/* Start button वापस enable */

document.getElementById("startButton").disabled =
false;


/* Status */

document.getElementById("status").innerText =
"✅ Location sharing पूरा हो गया।";


/* Result */

document.getElementById("result").innerHTML +=

"<br><br>" +

"✅ 50 location updates पूरे हो गए।" +

"<br>" +

"🔴 Location sharing अपने-आप बंद कर दी गई।";

}


/* =================================================
STOP LOCATION
================================================= */

function stopLocation(){

isSharing = false;

isGettingLocation = false;


/* Timer बंद */

if(locationTimer !== null){

clearInterval(locationTimer);

locationTimer = null;

}


/* Start button */

document.getElementById("startButton").disabled =
false;


/* Status */

document.getElementById("status").innerText =
"🔴 Location sharing बंद है।";


/* Result */

document.getElementById("result").innerHTML =

"🔴 Location sharing बंद कर दी गई।" +

"<br><br>" +

"📍 कुल सफल updates: " +

locationCount +

" / " +

MAX_LOCATIONS;

}


/* =================================================
END
================================================= */

</script>

</body>

</html>
