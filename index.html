<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Live Location Share</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    padding: 20px;
    font-family: Arial, sans-serif;
    background: #f4f7fb;
    color: #222;
}

.container {
    max-width: 600px;
    margin: auto;
}

.card {
    background: white;
    padding: 25px;
    border-radius: 18px;
    box-shadow: 0 5px 20px rgba(0,0,0,.10);
}

h1 {
    text-align: center;
    margin-top: 0;
}

button {
    width: 100%;
    padding: 15px;
    margin-top: 12px;
    border: 0;
    border-radius: 12px;
    font-size: 17px;
    font-weight: bold;
    cursor: pointer;
}

#startBtn {
    background: #16803a;
    color: white;
}

#stopBtn {
    background: #d00000;
    color: white;
}

.status {
    margin-top: 20px;
    padding: 15px;
    border-radius: 12px;
    text-align: center;
    background: #f1f1f1;
}

.info {
    margin-top: 20px;
    padding: 15px;
    border: 1px solid #ddd;
    border-radius: 12px;
    display: none;
}

.row {
    padding: 8px 0;
    border-bottom: 1px solid #eee;
    word-break: break-word;
}

.row:last-child {
    border-bottom: 0;
}

.label {
    font-weight: bold;
}

.error {
    margin-top: 15px;
    padding: 12px;
    background: #ffecec;
    color: #b00020;
    border-radius: 10px;
    display: none;
}
</style>
</head>

<body>

<div class="container">

<div class="card">

<h1>📍 Live Location Share</h1>

<button id="startBtn">
📍 Start Location Sharing
</button>

<button id="stopBtn">
⛔ Stop Sharing
</button>

<div id="status" class="status">
Location sharing अभी बंद है।
</div>

<div id="info" class="info">

<div class="row">
<div class="label">📱 Device ID</div>
<div id="device"></div>
</div>

<div class="row">
<div class="label">🌐 Latitude</div>
<div id="latitude"></div>
</div>

<div class="row">
<div class="label">🌐 Longitude</div>
<div id="longitude"></div>
</div>

<div class="row">
<div class="label">🎯 Accuracy</div>
<div id="accuracy"></div>
</div>

</div>

<div id="error" class="error"></div>

</div>

</div>


<script>

/* =====================================
   SUPABASE
===================================== */

const SUPABASE_URL =
"https://qtfnupdojsqpuywhoryu.supabase.co";

const SUPABASE_KEY =
"sb_publishable_GAsXGjXdKTZxlm5tqx-t0w_96i3RmKE";


/* =====================================
   ELEMENTS
===================================== */

const startBtn =
document.getElementById("startBtn");

const stopBtn =
document.getElementById("stopBtn");

const statusBox =
document.getElementById("status");

const infoBox =
document.getElementById("info");

const errorBox =
document.getElementById("error");

const deviceEl =
document.getElementById("device");

const latitudeEl =
document.getElementById("latitude");

const longitudeEl =
document.getElementById("longitude");

const accuracyEl =
document.getElementById("accuracy");


/* =====================================
   DEVICE ID
===================================== */

function getDeviceId() {

    let id =
    localStorage.getItem("location_device_id");

    if (!id) {

        if (
            window.crypto &&
            crypto.randomUUID
        ) {

            id = crypto.randomUUID();

        } else {

            id =
            "device-" +
            Date.now() +
            "-" +
            Math.random()
            .toString(36)
            .substring(2, 10);
        }

        localStorage.setItem(
            "location_device_id",
            id
        );
    }

    return id;
}

const DEVICE_ID = getDeviceId();

deviceEl.textContent = DEVICE_ID;


/* =====================================
   WATCH ID
===================================== */

let watchId = null;


/* =====================================
   SEND LOCATION
===================================== */

async function sendLocation(position) {

    const latitude =
    position.coords.latitude;

    const longitude =
    position.coords.longitude;

    const accuracy =
    position.coords.accuracy;


    /* Show immediately */

    latitudeEl.textContent =
    latitude.toFixed(7);

    longitudeEl.textContent =
    longitude.toFixed(7);

    accuracyEl.textContent =
    Math.round(accuracy) + " मीटर";

    infoBox.style.display = "block";


    statusBox.textContent =
    "🟢 Location server पर भेजी जा रही है...";


    try {

        /*
         IMPORTANT:
         हर update के लिए नई row बनेगी।
        */

        const response =
        await fetch(
            SUPABASE_URL +
            "/rest/v1/locations",
            {

                method: "POST",

                headers: {

                    "apikey":
                    SUPABASE_KEY,

                    "Authorization":
                    "Bearer " +
                    SUPABASE_KEY,

                    "Content-Type":
                    "application/json",

                    "Prefer":
                    "return=minimal"
                },

                body: JSON.stringify({

                    device_id:
                    DEVICE_ID,

                    latitude:
                    latitude,

                    longitude:
                    longitude,

                    accuracy:
                    accuracy,

                    created_at:
                    new Date().toISOString()

                })
            }
        );


        if (!response.ok) {

            const text =
            await response.text();

            throw new Error(
                response.status +
                " " +
                text
            );
        }


        statusBox.textContent =
        "🟢 Location server पर successfully update हो गई।";


        errorBox.style.display =
        "none";


    } catch (error) {

        console.error(error);

        statusBox.textContent =
        "🔴 Server पर location भेजने में समस्या।";

        errorBox.style.display =
        "block";

        errorBox.textContent =
        error.message;
    }
}


/* =====================================
   LOCATION SUCCESS
===================================== */

function locationSuccess(position) {

    sendLocation(position);
}


/* =====================================
   LOCATION ERROR
===================================== */

function locationError(error) {

    let message =
    "Location नहीं मिल पाई।";


    if (error.code === 1) {

        message =
        "❌ Location permission denied है।";

    } else if (error.code === 2) {

        message =
        "❌ Location उपलब्ध नहीं है।";

    } else if (error.code === 3) {

        message =
        "❌ Location मिलने में timeout हुआ।";
    }


    statusBox.textContent =
    message;

    errorBox.style.display =
    "block";

    errorBox.textContent =
    message;
}


/* =====================================
   START
===================================== */

function startLocation() {

    errorBox.style.display =
    "none";


    if (!navigator.geolocation) {

        statusBox.textContent =
        "❌ यह browser location support नहीं करता।";

        return;
    }


    if (!window.isSecureContext) {

        statusBox.textContent =
        "❌ Location के लिए HTTPS जरूरी है।";

        return;
    }


    statusBox.textContent =
    "⏳ Location शुरू की जा रही है...";


    /*
       पहले तुरंत एक location
    */

    navigator.geolocation.getCurrentPosition(

        locationSuccess,

        locationError,

        {
            enableHighAccuracy: true,
            timeout: 20000,
            maximumAge: 0
        }

    );


    /*
       इसके बाद लगातार location updates
    */

    watchId =
    navigator.geolocation.watchPosition(

        locationSuccess,

        locationError,

        {
            enableHighAccuracy: true,
            timeout: 20000,
            maximumAge: 5000
        }

    );
}


/* =====================================
   STOP
===================================== */

function stopLocation() {

    if (watchId !== null) {

        navigator.geolocation.clearWatch(
            watchId
        );

        watchId = null;
    }


    statusBox.textContent =
    "⛔ Location sharing बंद है।";
}


/* =====================================
   BUTTONS
===================================== */

startBtn.addEventListener(
    "click",
    startLocation
);

stopBtn.addEventListener(
    "click",
    stopLocation
);


/* =====================================
   DEVICE DISPLAY
===================================== */

deviceEl.textContent =
DEVICE_ID;

</script>

</body>
</html>
