<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Live Location Share</title>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#f2f4f7;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
}

.card{
    width:92%;
    max-width:430px;
    background:#fff;
    padding:25px;
    border-radius:20px;
    box-shadow:0 5px 25px rgba(0,0,0,.15);
    text-align:center;
}

h2{
    margin:0 0 10px;
}

p{
    color:#555;
    line-height:1.5;
}

button{
    width:100%;
    padding:15px;
    margin-top:12px;
    border:0;
    border-radius:12px;
    font-size:17px;
    cursor:pointer;
}

.location{
    background:#16a34a;
    color:#fff;
}

.stop{
    background:#dc2626;
    color:#fff;
}

#result{
    margin-top:20px;
    padding:15px;
    background:#f3f4f6;
    border-radius:12px;
    text-align:left;
    line-height:1.6;
    word-break:break-word;
}

.status{
    margin-top:15px;
    font-weight:bold;
}
</style>
</head>

<body>

<div class="card">

    <h2>📍 Live Location Share</h2>

    <p>
        अपनी location share करने के लिए
        नीचे बटन दबाएँ।
    </p>

    <button
        class="location"
        onclick="startLocation()">
        📍 Share My Location
    </button>

    <button
        class="stop"
        onclick="stopLocation()">
        ⛔ Stop Sharing
    </button>

    <div id="result">
        Location sharing अभी बंद है।
    </div>

</div>


<script>

/* =================================================
   SUPABASE SETTINGS
   ================================================= */

/*
   यहाँ अपनी Supabase Publishable Key डालें।

   उदाहरण:
   const SUPABASE_KEY =
   "sb_publishable_xxxxxxxxxxxxx";

   ध्यान दें:
   sb_secret_ वाली key यहाँ बिल्कुल न डालें।
*/

const SUPABASE_URL =
"https://qtfnupdojsqpuywhoryu.supabase.co";

const SUPABASE_KEY =
"sb_publishable_GAsXGjXdKTZxlm5tqx-t0w_96i3RmKE";


/* =================================================
   DEVICE ID
   ================================================= */

let deviceId =
    localStorage.getItem("location_device_id");

if(!deviceId){

    deviceId =
        crypto.randomUUID();

    localStorage.setItem(
        "location_device_id",
        deviceId
    );
}


/* =================================================
   LOCATION WATCH
   ================================================= */

let watchId = null;


/* =================================================
   START LOCATION
   ================================================= */

function startLocation(){

    const result =
        document.getElementById("result");


    if(
        !navigator.geolocation
    ){

        result.innerHTML =
            "❌ इस browser में Location उपलब्ध नहीं है।";

        return;
    }


    result.innerHTML =
        "⏳ Location permission माँगी जा रही है...";


    /*
       Browser सामने वाले व्यक्ति से
       location permission माँगेगा।
    */

    watchId =
        navigator.geolocation.watchPosition(

            async function(position){

                const latitude =
                    position.coords.latitude;

                const longitude =
                    position.coords.longitude;

                const accuracy =
                    position.coords.accuracy;


                result.innerHTML =

                    "🟢 Location sharing चालू है।<br><br>" +

                    "Latitude: " +
                    latitude +
                    "<br>" +

                    "Longitude: " +
                    longitude +
                    "<br>" +

                    "Accuracy: लगभग " +
                    Math.round(accuracy) +
                    " मीटर<br><br>" +

                    "📡 Location server पर भेजी जा रही है...";


                /*
                   Supabase में location भेजें
                */

                await sendLocation(
                    latitude,
                    longitude,
                    accuracy
                );

            },

            function(error){

                let message =
                    "Location नहीं मिली।";

                if(error.code === 1){

                    message =
                        "Location permission deny कर दी गई।";

                }
                else if(error.code === 2){

                    message =
                        "Location उपलब्ध नहीं है।";

                }
                else if(error.code === 3){

                    message =
                        "Location प्राप्त करने में timeout हुआ।";
                }


                result.innerHTML =
                    "❌ " + message;
            },

            {

                enableHighAccuracy:true,

                timeout:15000,

                maximumAge:5000

            }
        );
}


/* =================================================
   SEND LOCATION TO SUPABASE
   ================================================= */

async function sendLocation(
    latitude,
    longitude,
    accuracy
){

    try{

        const response =
            await fetch(

                SUPABASE_URL +
                "/rest/v1/locations",

                {

                    method:"POST",

                    headers:{

                        "apikey":
                            SUPABASE_KEY,

                        "Authorization":
                            "Bearer " +
                            SUPABASE_KEY,

                        "Content-Type":
                            "application/json",

                        "Prefer":
                            "return=minimal"
                    },

                    body:JSON.stringify({

                        device_id:
                            deviceId,

                        latitude:
                            latitude,

                        longitude:
                            longitude,

                        accuracy:
                            accuracy

                    })
                }
            );


        if(!response.ok){

            const errorText =
                await response.text();

            console.log(
                "Supabase Error:",
                errorText
            );

            document.getElementById("result")
                .innerHTML +=
                "<br><br>⚠️ Server पर location भेजने में समस्या।";

            return;
        }


        document.getElementById("result")
            .innerHTML +=
            "<br>✅ Location server पर भेज दी गई।";


    }
    catch(error){

        console.log(
            "Network Error:",
            error
        );

        document.getElementById("result")
            .innerHTML +=
            "<br><br>⚠️ Internet connection की समस्या।";
    }
}


/* =================================================
   STOP LOCATION
   ================================================= */

function stopLocation(){

    if(
        watchId !== null
    ){

        navigator.geolocation.clearWatch(
            watchId
        );

        watchId = null;
    }


    document.getElementById("result")
        .innerHTML =
        "🔴 Location sharing बंद कर दी गई।";
}

</script>

</body>
</html>
