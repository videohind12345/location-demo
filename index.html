<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Madam Live Location Searching</title>

<style>
    body {
        font-family: Arial, sans-serif;
        background: #f4f6f8;
        margin: 0;
        padding: 20px;
        text-align: center;
    }

    .box {
        max-width: 500px;
        margin: auto;
        background: white;
        padding: 25px;
        border-radius: 15px;
        box-shadow: 0 4px 15px rgba(0,0,0,0.12);
    }

    h2 {
        margin-top: 0;
    }

    button {
        padding: 13px 22px;
        margin: 8px;
        border: none;
        border-radius: 8px;
        font-size: 16px;
        cursor: pointer;
    }

    #startBtn {
        background: #16a34a;
        color: white;
    }

    #stopBtn {
        background: #dc2626;
        color: white;
    }

    #status {
        margin-top: 20px;
        padding: 15px;
        background: #f1f5f9;
        border-radius: 10px;
        text-align: left;
        line-height: 1.7;
        word-break: break-word;
    }

    .good {
        color: #15803d;
        font-weight: bold;
    }

    .wait {
        color: #ca8a04;
        font-weight: bold;
    }

    .error {
        color: #dc2626;
        font-weight: bold;
    }
</style>
</head>

<body>

<div class="box">

    <h2>📍 Madam Live Location</h2>

    <button id="startBtn">▶ Start Location</button>
    <button id="stopBtn">⏹ Stop</button>

    <div id="status">
        Location tracking बंद है.
    </div>

</div>

<script>

/* ==============================
   SUPABASE CONFIG
================================ */

const SUPABASE_URL =
"https://qtfnupdojsqpuywhoryu.supabase.co";

const SUPABASE_KEY =
"sb_publishable_GAsXGjXdKTZxlm5tqx-t0w_96i3RmKE";


/* ==============================
   DEVICE ID
================================ */

let deviceId = localStorage.getItem("device_id");

if (!deviceId) {
    deviceId = crypto.randomUUID();
    localStorage.setItem("device_id", deviceId);
}


/* ==============================
   VARIABLES
================================ */

let watchId = null;
let tracking = false;

let firstLocationSaved = false;

let bestAccuracy = Infinity;
let lastSavedAccuracy = Infinity;

let lastLatitude = null;
let lastLongitude = null;
let lastSavedTime = 0;


/* ==============================
   HTML ELEMENTS
================================ */

const statusBox = document.getElementById("status");
const startBtn = document.getElementById("startBtn");
const stopBtn = document.getElementById("stopBtn");


/* ==============================
   STATUS FUNCTION
================================ */

function showStatus(message, type = "") {

    statusBox.className = type;

    statusBox.innerHTML = message;
}


/* ==============================
   DISTANCE CALCULATION
================================ */

function distanceInMeters(lat1, lon1, lat2, lon2) {

    const R = 6371000;

    const p1 = lat1 * Math.PI / 180;
    const p2 = lat2 * Math.PI / 180;

    const dp = (lat2 - lat1) * Math.PI / 180;
    const dl = (lon2 - lon1) * Math.PI / 180;

    const a =
        Math.sin(dp / 2) * Math.sin(dp / 2) +
        Math.cos(p1) *
        Math.cos(p2) *
        Math.sin(dl / 2) *
        Math.sin(dl / 2);

    const c = 2 * Math.atan2(
        Math.sqrt(a),
        Math.sqrt(1 - a)
    );

    return R * c;
}


/* ==============================
   REVERSE GEOCODING
================================ */

async function getCityState(latitude, longitude) {

    try {

        const url =
            "https://api.bigdatacloud.net/data/reverse-geocode-client" +
            "?latitude=" + latitude +
            "&longitude=" + longitude +
            "&localityLanguage=en";

        const response = await fetch(url);

        if (!response.ok) {
            return {
                city: "",
                state: ""
            };
        }

        const data = await response.json();

        let city =
            data.city ||
            data.locality ||
            data.principalSubdivision ||
            "";

        let state =
            data.principalSubdivision ||
            "";

        return {
            city: city,
            state: state
        };

    } catch (error) {

        console.log("Reverse geocode error:", error);

        return {
            city: "",
            state: ""
        };
    }
}


/* ==============================
   SAVE LOCATION
================================ */

async function saveLocation(
    latitude,
    longitude,
    accuracy
) {

    try {

        showStatus(`
            📡 GPS Location मिली<br><br>

            Latitude: ${latitude}<br>
            Longitude: ${longitude}<br>
            🎯 Accuracy: ${accuracy.toFixed(1)} m<br><br>

            ⏳ Location save हो रही है...
        `);


        /* Get city/state */

        const locationInfo =
            await getCityState(latitude, longitude);


        const payload = {

            device_id: deviceId,

            latitude: latitude,

            longitude: longitude,

            accuracy: accuracy,

            city: locationInfo.city,

            state: locationInfo.state
        };


        const response = await fetch(
            SUPABASE_URL + "/rest/v1/locations",
            {
                method: "POST",

                headers: {

                    "apikey": SUPABASE_KEY,

                    "Content-Type":
                        "application/json",

                    "Accept":
                        "application/json",

                    "Prefer":
                        "return=minimal"
                },

                body: JSON.stringify(payload)
            }
        );


        if (!response.ok) {

            const errorText =
                await response.text();

            throw new Error(
                response.status +
                " " +
                errorText
            );
        }


        /* Remember saved information */

        lastSavedAccuracy = accuracy;

        lastLatitude = latitude;

        lastLongitude = longitude;

        lastSavedTime = Date.now();

        firstLocationSaved = true;


        showStatus(`

            <span class="good">
            ✅ LOCATION SAVED
            </span>

            <br><br>

            📍 Latitude:
            ${latitude}<br>

            📍 Longitude:
            ${longitude}<br>

            🎯 Accuracy:
            <b>${accuracy.toFixed(1)} m</b><br>

            🏙️ City:
            ${locationInfo.city || "Unknown"}<br>

            🗺️ State:
            ${locationInfo.state || "Unknown"}<br><br>

            📱 Device ID:<br>
            ${deviceId}<br><br>

            🟢 GPS tracking चालू है...
        `);


    } catch (error) {

        console.error(error);

        showStatus(`

            <span class="error">
            ❌ Location Save Error
            </span>

            <br><br>

            ${error.message}

        `);
    }
}


/* ==============================
   GPS SUCCESS
================================ */

function gpsSuccess(position) {

    const latitude =
        position.coords.latitude;

    const longitude =
        position.coords.longitude;

    const accuracy =
        position.coords.accuracy;


    /* Update best accuracy */

    if (accuracy < bestAccuracy) {

        bestAccuracy = accuracy;
    }


    console.log(
        "GPS:",
        latitude,
        longitude,
        "Accuracy:",
        accuracy
    );


    /* =====================================
       FIRST LOCATION
       तुरंत save होगी
    ====================================== */

    if (!firstLocationSaved) {

        saveLocation(
            latitude,
            longitude,
            accuracy
        );

        return;
    }


    /* =====================================
       AFTER FIRST LOCATION

       Better accuracy होने पर save करें
    ====================================== */

    const accuracyImproved =
        accuracy < lastSavedAccuracy;


    /* Position changed */

    let moved = false;

    if (
        lastLatitude !== null &&
        lastLongitude !== null
    ) {

        const distance =
            distanceInMeters(
                lastLatitude,
                lastLongitude,
                latitude,
                longitude
            );

        moved = distance >= 20;
    }


    /* Save conditions

       1. Accuracy बेहतर हुई
       OR
       2. Phone कम से कम 20m move हुआ
       OR
       3. 30 seconds हो गए
    */

    const thirtySecondsPassed =
        Date.now() - lastSavedTime >= 30000;


    if (
        accuracyImproved ||
        moved ||
        thirtySecondsPassed
    ) {

        saveLocation(
            latitude,
            longitude,
            accuracy
        );

    } else {

        showStatus(`

            📡 GPS tracking चालू है...<br><br>

            Latitude:
            ${latitude}<br>

            Longitude:
            ${longitude}<br>

            🎯 Current Accuracy:
            <b>${accuracy.toFixed(1)} m</b><br>

            🏆 Best Accuracy:
            <b>${bestAccuracy.toFixed(1)} m</b><br><br>

            🟢 Location लगातार track हो रही है...
        `);
    }
}


/* ==============================
   GPS ERROR
================================ */

function gpsError(error) {

    console.error(error);


    let message = "";


    if (error.code === 1) {

        message =
            "❌ Location permission denied.<br>" +
            "Phone में Location Permission Allow करें.";

    }

    else if (error.code === 2) {

        message =
            "⚠️ GPS Location अभी नहीं मिल रही.<br>" +
            "GPS/Location ON रखें.";

    }

    else if (error.code === 3) {

        message =
            "⚠️ GPS Timeout.<br>" +
            "फिर से GPS signal लेने की कोशिश हो रही है...";

    }

    else {

        message =
            "❌ GPS Error: " +
            error.message;
    }


    showStatus(
        message,
        "error"
    );
}


/* ==============================
   START TRACKING
================================ */

function startTracking() {

    if (!navigator.geolocation) {

        showStatus(
            "❌ इस device में GPS/Geolocation supported नहीं है.",
            "error"
        );

        return;
    }


    if (tracking) {

        return;
    }


    tracking = true;

    firstLocationSaved = false;

    bestAccuracy = Infinity;

    lastSavedAccuracy = Infinity;

    lastLatitude = null;

    lastLongitude = null;

    lastSavedTime = 0;


    showStatus(`
        📡 GPS signal खोजा जा रहा है...<br><br>
        कृपया Location Permission Allow रखें.
    `);


    /* =====================================
       CONTINUOUS GPS TRACKING
    ====================================== */

    watchId =
        navigator.geolocation.watchPosition(

            gpsSuccess,

            gpsError,

            {

                enableHighAccuracy: true,

                maximumAge: 0,

                timeout: 15000
            }
        );
}


/* ==============================
   STOP TRACKING
================================ */

function stopTracking() {

    if (watchId !== null) {

        navigator.geolocation.clearWatch(
            watchId
        );

        watchId = null;
    }


    tracking = false;


    showStatus(`
        ⏹️ GPS tracking बंद कर दी गई है.
    `);
}


/* ==============================
   BUTTONS
================================ */

startBtn.addEventListener(
    "click",
    startTracking
);

stopBtn.addEventListener(
    "click",
    stopTracking
);


/* ==============================
   PAGE LOAD
================================ */

console.log(
    "Device ID:",
    deviceId
);

</script>

</body>
</html>
