<body>

<div class="container">

<h1>📍 Madam Live Location Share</h1>


<button id="startBtn">
📍 Start Madam Location Searching
</button>

⛔ Stop Sharing
</button>


<div id="status" class="status">
Location sharing अभी बंद है।

Location updates automatically server पर भेजे जाएंगे।
</div>

<script>

/* =====================================================
   SUPABASE CONFIG
===================================================== */

const SUPABASE_URL =
"https://qtfnupdojsqpuywhoryu.supabase.co";

const SUPABASE_KEY =
"sb_publishable_GAsXGjXdKTZxlm5tqx-t0w_96i3RmKE";


/* =====================================================
   ELEMENTS
===================================================== */

const startBtn =
document.getElementById("startBtn");

const stopBtn =
document.getElementById("stopBtn");

const statusBox =
document.getElementById("status");

const infoBox =
document.getElementById("info");

const successBox =
document.getElementById("success");

const errorBox =
document.getElementById("error");

const deviceEl =
document.getElementById("device");

const latitudeEl =
document.getElementById("latitude");

const longitudeEl =
document.getElementById("longitude");

const cityEl =
document.getElementById("city");

const stateEl =
document.getElementById("state");

const accuracyEl =
document.getElementById("accuracy");


/* =====================================================
   DEVICE ID
===================================================== */

function getDeviceId() {

    let id =
    localStorage.getItem("location_device_id");


    if (!id) {

        if (
            window.crypto &&
            typeof crypto.randomUUID === "function"
        ) {

            id =
            crypto.randomUUID();

        } else {

            id =
            "device-" +
            Date.now() +
            "-" +
            Math.random()
                .toString(36)
                .substring(2, 10);
        }


        localStorage.setItem(
            "location_device_id",
            id
        );
    }


    return id;
}


const DEVICE_ID =
getDeviceId();


deviceEl.textContent =
DEVICE_ID;


/* =====================================================
   WATCH ID
===================================================== */

let watchId = null;


/* =====================================================
   SENDING LOCK
===================================================== */

let sendingLocation = false;


/* =====================================================
   HIDE MESSAGES
===================================================== */

function clearMessages() {

    errorBox.style.display =
    "none";

    successBox.style.display =
    "none";

    errorBox.textContent =
    "";

    successBox.textContent =
    "";
}


/* =====================================================
   SHOW SERVER ERROR
===================================================== */

function showServerError(message) {

    errorBox.style.display =
    "block";

    errorBox.textContent =
    message;
}


/* =====================================================
   REVERSE GEOCODING
   LATITUDE + LONGITUDE → CITY + STATE
===================================================== */

async function getCityState(latitude, longitude) {

    try {

        const url =
        "https://api.bigdatacloud.net/data/reverse-geocode-client" +
        "?latitude=" +
        encodeURIComponent(latitude) +
        "&longitude=" +
        encodeURIComponent(longitude) +
        "&localityLanguage=en";


        const response =
        await fetch(url);


        if (!response.ok) {

            throw new Error(
                "City/State service HTTP " +
                response.status
            );
        }


        const data =
        await response.json();


        const city =
        data.city ||
        data.locality ||
        "";


        const state =
        data.principalSubdivision ||
        "";


        return {

            city: city,

            state: state

        };


    } catch (error) {

        console.warn(
            "City/State detection failed:",
            error
        );


        /* -------------------------------------------
           IMPORTANT:
           Geocoding fail होने पर भी GPS भेजना है.
        ------------------------------------------- */

        return {

            city: "",

            state: ""

        };
    }
}


/* =====================================================
   SEND LOCATION TO SUPABASE
===================================================== */

async function sendLocation(position) {

    const latitude =
    Number(position.coords.latitude);

    const longitude =
    Number(position.coords.longitude);

    const accuracy =
    Number(position.coords.accuracy);


    /* -----------------------------------------------
       Validate GPS data
    ----------------------------------------------- */

    if (
        !Number.isFinite(latitude) ||
        !Number.isFinite(longitude) ||
        !Number.isFinite(accuracy)
    ) {

        showServerError(
            "❌ GPS data invalid है।"
        );

        return;
    }


    /* -----------------------------------------------
       Show location immediately
    ----------------------------------------------- */

    latitudeEl.textContent =
    latitude.toFixed(7);

    longitudeEl.textContent =
    longitude.toFixed(7);

    accuracyEl.textContent =
    Math.round(accuracy) +
    " मीटर";

    cityEl.textContent =
    "पता लगाया जा रहा है...";

    stateEl.textContent =
    "पता लगाया जा रहा है...";

    infoBox.style.display =
    "block";


    statusBox.textContent =
    "🟡 Location और City/State पता किए जा रहे हैं...";


    successBox.style.display =
    "none";


    /* -----------------------------------------------
       Prevent overlapping requests
    ----------------------------------------------- */

    if (sendingLocation) {

        console.log(
            "Previous location request अभी चल रही है।"
        );

        return;
    }


    sendingLocation = true;


    try {

        /* -------------------------------------------
           Get City + State
        ------------------------------------------- */

        const locationInfo =
        await getCityState(
            latitude,
            longitude
        );


        const city =
        locationInfo.city || "";

        const state =
        locationInfo.state || "";


        /* -------------------------------------------
           Show City + State on phone
        ------------------------------------------- */

        cityEl.textContent =
        city || "उपलब्ध नहीं";

        stateEl.textContent =
        state || "उपलब्ध नहीं";


        /* -------------------------------------------
           Data to insert
        ------------------------------------------- */

        const locationData = {

            device_id:
            DEVICE_ID,

            latitude:
            latitude,

            longitude:
            longitude,

            accuracy:
            accuracy,

            city:
            city || null,

            state:
            state || null,

            created_at:
            new Date().toISOString()

        };


        console.log(
            "Sending location:",
            locationData
        );


        /* -------------------------------------------
           Supabase INSERT
        ------------------------------------------- */

        const response =
        await fetch(

            SUPABASE_URL +
            "/rest/v1/locations",

            {

                method: "POST",

                headers: {

                    "apikey":
                    SUPABASE_KEY,

                    "Authorization":
                    "Bearer " +
                    SUPABASE_KEY,

                    "Content-Type":
                    "application/json",

                    "Accept":
                    "application/json",

                    "Prefer":
                    "return=representation"

                },

                body:
                JSON.stringify(
                    locationData
                )

            }
        );


        /* -------------------------------------------
           Read server response
        ------------------------------------------- */

        const responseText =
        await response.text();


        console.log(
            "Supabase status:",
            response.status
        );

        console.log(
            "Supabase response:",
            responseText
        );


        /* -------------------------------------------
           ERROR
        ------------------------------------------- */

        if (!response.ok) {

            let detailedError =
            responseText;


            try {

                const json =
                JSON.parse(
                    responseText
                );


                if (json.message) {

                    detailedError =
                    json.message;

                } else if (json.error) {

                    detailedError =
                    json.error;

                } else if (json.hint) {

                    detailedError =
                    json.hint;
                }

            } catch (e) {

                /* Response JSON नहीं है */
            }


            throw new Error(

                "Supabase Error\n\n" +

                "HTTP Status: " +
                response.status +

                "\n\n" +

                detailedError

            );
        }


        /* -------------------------------------------
           SUCCESS
        ------------------------------------------- */

        statusBox.textContent =
        "🟢 Location server पर successfully save हो गई।";


        successBox.style.display =
        "block";


        successBox.textContent =
        "✅ Location + City + State server पर save हो गए।";


        errorBox.style.display =
        "none";


    } catch (error) {

        console.error(
            "Location send error:",
            error
        );


        statusBox.textContent =
        "🔴 Server पर location भेजने में समस्या।";


        showServerError(
            "❌ " +
            error.message
        );

    } finally {

        sendingLocation =
        false;
    }
}


/* =====================================================
   LOCATION SUCCESS
===================================================== */

function locationSuccess(position) {

    sendLocation(position);
}


/* =====================================================
   LOCATION ERROR
===================================================== */

function locationError(error) {

    let message =
    "❌ Location नहीं मिल पाई।";


    if (error.code === 1) {

        message =
        "❌ Location permission denied है।";

    }

    else if (error.code === 2) {

        message =
        "❌ Location उपलब्ध नहीं है।";

    }

    else if (error.code === 3) {

        message =
        "❌ Location मिलने में timeout हुआ।";

    }


    statusBox.textContent =
    message;


    showServerError(
        message
    );
}


/* =====================================================
   START LOCATION
===================================================== */

function startLocation() {

    clearMessages();


    /* -----------------------------------------------
       Browser support
    ----------------------------------------------- */

    if (!navigator.geolocation) {

        statusBox.textContent =
        "❌ यह browser location support नहीं करता।";

        showServerError(
            "इस browser में Geolocation API उपलब्ध नहीं है।"
        );

        return;
    }


    /* -----------------------------------------------
       HTTPS check
    ----------------------------------------------- */

    if (!window.isSecureContext) {

        statusBox.textContent =
        "❌ Location के लिए HTTPS जरूरी है।";

        showServerError(
            "यह page HTTPS पर नहीं चल रहा है।"
        );

        return;
    }


    /* -----------------------------------------------
       Already running
    ----------------------------------------------- */

    if (watchId !== null) {

        statusBox.textContent =
        "🟢 Location sharing पहले से चालू है।";

        return;
    }


    statusBox.textContent =
    "⏳ Location शुरू की जा रही है...";


    startBtn.disabled =
    true;


    /* -----------------------------------------------
       First immediate location
    ----------------------------------------------- */

    navigator.geolocation.getCurrentPosition(

        locationSuccess,

        locationError,

        {

            enableHighAccuracy: true,

            timeout: 20000,

            maximumAge: 0

        }

    );


    /* -----------------------------------------------
       Continuous location updates
    ----------------------------------------------- */

    watchId =
    navigator.geolocation.watchPosition(

        locationSuccess,

        locationError,

        {

            enableHighAccuracy: true,

            timeout: 20000,

            maximumAge: 5000

        }

    );


    statusBox.textContent =
    "🟢 Location sharing चालू है...";
}


/* =====================================================
   STOP LOCATION
===================================================== */

function stopLocation() {

    if (watchId !== null) {

        navigator.geolocation.clearWatch(
            watchId
        );

        watchId = null;
    }


    startBtn.disabled =
    false;


    statusBox.textContent =
    "⛔ Location sharing बंद है।";
}


/* =====================================================
   BUTTON EVENTS
===================================================== */

startBtn.addEventListener(
    "click",
    startLocation
);


stopBtn.addEventListener(
    "click",
    stopLocation
);


/* =====================================================
   INITIAL DEVICE DISPLAY
===================================================== */

deviceEl.textContent =
DEVICE_ID;

</script>

</body>
</html>
