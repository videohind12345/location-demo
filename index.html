```html
<!DOCTYPE html>
<html lang="hi">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Live Location Share</title>

<style>

*{
box-sizing:border-box;
}

body{
margin:0;
font-family:Arial,sans-serif;
background:#f2f4f7;
min-height:100vh;
display:flex;
align-items:center;
justify-content:center;
}

.card{
width:92%;
max-width:430px;
background:#fff;
padding:25px;
border-radius:20px;
box-shadow:0 5px 25px rgba(0,0,0,.15);
text-align:center;
}

h2{
margin:0 0 10px;
}

p{
color:#555;
line-height:1.5;
}

button{
width:100%;
padding:15px;
margin-top:12px;
border:0;
border-radius:12px;
font-size:17px;
cursor:pointer;
-webkit-tap-highlight-color:transparent;
}

button:focus{
outline:2px solid #dc2626;
outline-offset:2px;
}

button:disabled{
opacity:.6;
cursor:not-allowed;
}

.location{
background:#16a34a;
color:#fff;
}

.stop{
background:#dc2626;
color:#fff;
}

#result{
margin-top:20px;
padding:15px;
background:#f3f4f6;
border-radius:12px;
text-align:left;
line-height:1.6;
word-break:break-word;
}

.counter{
margin-top:15px;
font-size:20px;
font-weight:bold;
}

.status{
margin-top:10px;
font-size:14px;
color:#555;
}

</style>

</head>

<body>

<div class="card">

<h2>📍 Live Location Share</h2>

<p>
अपनी location share करने के लिए नीचे बटन दबाएँ।
</p>

<button
id="startButton"
class="location"
type="button">

📍 Share My Location

</button>

<button
id="stopButton"
class="stop"
type="button">

⛔ Stop Sharing

</button>

<div class="counter" id="counter">
0 / 50
</div>

<div class="status" id="status">
Location sharing अभी बंद है।
</div>

<div id="result">
Location sharing अभी बंद है।
</div>

</div>


<script>

/* =================================================
SUPABASE
================================================= */

const SUPABASE_URL =
"https://qtfnupdojsqpuywhoryu.supabase.co";

const SUPABASE_KEY =
"sb_publishable_GAsXGjXdKTZxlm5tqx-t0w_96i3RmKE";


/* =================================================
SETTINGS
================================================= */

const MAX_LOCATIONS = 50;

const LOCATION_INTERVAL = 5000;


/* =================================================
DEVICE ID
================================================= */

let deviceId =
localStorage.getItem("location_device_id");

if(!deviceId){

deviceId =
crypto.randomUUID();

localStorage.setItem(
"location_device_id",
deviceId
);

}


/* =================================================
VARIABLES
================================================= */

let locationCount = 0;

let isSharing = false;

let locationTimer = null;

let isGettingLocation = false;


/* =================================================
ELEMENTS
================================================= */

const startButton =
document.getElementById("startButton");

const stopButton =
document.getElementById("stopButton");

const counter =
document.getElementById("counter");

const status =
document.getElementById("status");

const result =
document.getElementById("result");


/* =================================================
BUTTON EVENTS
================================================= */

startButton.addEventListener(
"click",
startLocation
);

stopButton.addEventListener(
"click",
stopLocation
);


/* =================================================
START
================================================= */

function startLocation(){

console.log("START BUTTON CLICKED");


if(!navigator.geolocation){

result.innerHTML =
"❌ इस browser में Location उपलब्ध नहीं है।";

return;

}


/*
HTTPS check
*/

if(
location.protocol !== "https:" &&
location.hostname !== "localhost"
){

result.innerHTML =
"❌ Location के लिए HTTPS जरूरी है।";

return;

}


/*
Already running
*/

if(isSharing){

status.innerText =
"🟢 Location sharing पहले से चालू है।";

return;

}


/*
Reset
*/

locationCount = 0;

counter.innerText =
"0 / 50";

isSharing = true;

startButton.disabled = true;

status.innerText =
"⏳ Location permission माँगी जा रही है...";

result.innerHTML =
"⏳ कृपया Location permission में Allow दबाएँ।";


/*
पहली location तुरंत
*/

getLocation();


/*
हर 5 सेकंड
*/

locationTimer =
setInterval(

function(){

if(
isSharing &&
locationCount < MAX_LOCATIONS
){

getLocation();

}

},

LOCATION_INTERVAL

);

}


/* =================================================
GET LOCATION
================================================= */

function getLocation(){

if(!isSharing){

return;

}

if(isGettingLocation){

return;

}

if(locationCount >= MAX_LOCATIONS){

finishSharing();

return;

}

isGettingLocation = true;

status.innerText =
"📡 Location प्राप्त की जा रही है...";


navigator.geolocation.getCurrentPosition(

handleLocation,

handleLocationError,

{

enableHighAccuracy:true,

timeout:15000,

maximumAge:0

}

);

}


/* =================================================
LOCATION SUCCESS
================================================= */

async function handleLocation(position){

isGettingLocation = false;


if(!isSharing){

return;

}


const latitude =
position.coords.latitude;

const longitude =
position.coords.longitude;

const accuracy =
position.coords.accuracy;


status.innerText =
"📡 Location server पर भेजी जा रही है...";


const success =
await sendLocation(

latitude,
longitude,
accuracy

);


if(!success){

status.innerText =
"⚠️ Location server पर नहीं भेजी गई।";

return;

}


/*
SUCCESS
*/

locationCount++;

counter.innerText =
locationCount +
" / " +
MAX_LOCATIONS;


status.innerText =
"🟢 Location sharing चालू है।";


result.innerHTML =

"🟢 Location सफलतापूर्वक भेजी गई।" +

"<br><br>" +

"Latitude: " +
latitude +

"<br>" +

"Longitude: " +
longitude +

"<br>" +

"Accuracy: लगभग " +
Math.round(accuracy) +
" मीटर" +

"<br><br>" +

"📡 Server पर भेजी गई।" +

"<br>" +

"📍 Update: " +
locationCount +
" / " +
MAX_LOCATIONS;


/*
50 complete
*/

if(
locationCount >= MAX_LOCATIONS
){

finishSharing();

}

}


/* =================================================
LOCATION ERROR
================================================= */

function handleLocationError(error){

isGettingLocation = false;


console.log(
"Location Error:",
error
);


let message = "";


if(error.code === 1){

message =
"❌ Location permission deny कर दी गई।";

}

else if(error.code === 2){

message =
"❌ Location उपलब्ध नहीं है।";

}

else if(error.code === 3){

message =
"❌ Location प्राप्त करने में timeout हुआ।";

}

else{

message =
"❌ Location प्राप्त करने में समस्या हुई।";

}


/*
Permission denied
*/

if(error.code === 1){

isSharing = false;

if(locationTimer !== null){

clearInterval(locationTimer);

locationTimer = null;

}

startButton.disabled = false;

}


/*
Screen
*/

status.innerText =
"⚠️ Location error";

result.innerHTML =

message +

"<br><br>" +

"अगर permission बंद है तो browser settings में Location को Allow करें।";

}


/* =================================================
SEND TO SUPABASE
================================================= */

async function sendLocation(

latitude,
longitude,
accuracy

){

try{

const response =
await fetch(

SUPABASE_URL +
"/rest/v1/locations",

{

method:"POST",

headers:{

"apikey":
SUPABASE_KEY,

"Authorization":
"Bearer " +
SUPABASE_KEY,

"Content-Type":
"application/json",

"Prefer":
"return=minimal"

},

body:JSON.stringify({

device_id:
deviceId,

latitude:
latitude,

longitude:
longitude,

accuracy:
accuracy

})

}

);


if(!response.ok){

const errorText =
await response.text();

console.log(
"SUPABASE ERROR:",
errorText
);


result.innerHTML =

"❌ Supabase Error" +

"<br><br>" +

errorText;

return false;

}


return true;

}

catch(error){

console.log(
"NETWORK ERROR:",
error
);


result.innerHTML =

"❌ Internet / Network Error" +

"<br><br>" +

error.message;

return false;

}

}


/* =================================================
FINISH 50
================================================= */

function finishSharing(){

isSharing = false;

isGettingLocation = false;


if(locationTimer !== null){

clearInterval(locationTimer);

locationTimer = null;

}


startButton.disabled = false;


status.innerText =
"✅ 50 location updates पूरे हो गए।";


result.innerHTML +=

"<br><br>" +

"✅ 50 location updates पूरे हो गए।" +

"<br>" +

"🔴 Location sharing अपने-आप बंद हो गई।";

}


/* =================================================
STOP
================================================= */

function stopLocation(){

isSharing = false;

isGettingLocation = false;


if(locationTimer !== null){

clearInterval(locationTimer);

locationTimer = null;

}


startButton.disabled = false;


status.innerText =
"🔴 Location sharing बंद है।";


result.innerHTML =

"🔴 Location sharing बंद कर दी गई।" +

"<br><br>" +

"📍 कुल सफल updates: " +

locationCount +

" / 50";

}

</script>

</body>

</html>
```
