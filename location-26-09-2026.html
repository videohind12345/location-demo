<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Madam Live Location Searching</title>
<title>मैडम की लाइव लोकेशन सर्चिंग</title>
<style>

body {
    font-family: Arial, sans-serif;
    background: #f5f5f5;
    margin: 0;
    padding: 20px;
    text-align: center;
}

.container {
    max-width: 500px;
    margin: auto;
}

button {
    padding: 12px 20px;
    margin: 8px;
    border: none;
    border-radius: 8px;
    font-size: 16px;
    cursor: pointer;
}

.start {
    background: #16a34a;
    color: white;
}

.stop {
    background: #dc2626;
    color: white;
}

#status {
    background: white;
    padding: 20px;
    margin-top: 20px;
    border-radius: 12px;
    text-align: left;
    line-height: 1.7;
    word-break: break-word;
}

</style>
</head>

<body>

<div class="container">

<h2>📍 Madam Live Location Searching</h2>
<h2>📍 मैडम की लाइव लोकेशन सर्चिंग</h2>

    <button
    class="start"
    onclick="startTracking()">
    ▶ Start Location / मैडम की लोकेशन सर्च करना स्टार्ट करें
</button>

<button
    class="stop"
    onclick="stopTracking()">
    ⏹ Stop / मैडम की लोकेशन सर्च करना बंद करें
</button>

<div id="status">

    📡 मैडम की लोकेशन ट्रैकिंग अभी बंद कर दी गई है बंद है.

</div>

</div>


<script>

/* ==========================================
   SUPABASE
========================================== */

const SUPABASE_URL =
"https://qtfnupdojsqpuywhoryu.supabase.co";

const SUPABASE_KEY =
"sb_publishable_GAsXGjXdKTZxlm5tqx-t0w_96i3RmKE";


/* ==========================================
   DEVICE ID
========================================== */

let deviceId =
localStorage.getItem("device_id");

if (!deviceId) {

    deviceId =
        crypto.randomUUID();

    localStorage.setItem(
        "device_id",
        deviceId
    );
}


/* ==========================================
   GPS
========================================== */

let watchId = null;


/* ==========================================
   START
========================================== */

function startTracking() {

    if (!navigator.geolocation) {

        document.getElementById(
            "status"
        ).innerHTML =
            "❌Madam GPS supported नहीं है.";

        return;
    }


    document.getElementById(
        "status"
    ).innerHTML =
        "📡 Madam GPS signal मिल रहा है...";


    watchId =
        navigator.geolocation.watchPosition(

            position => {

                const latitude =
                    position.coords.latitude;

                const longitude =
                    position.coords.longitude;

                const accuracy =
                    position.coords.accuracy;


                document.getElementById(
                    "status"
                ).innerHTML = `

                    📡 Madam GPS signal मिल रहा है...

                    <br><br>

                    Latitude:
                    ${latitude}

                    <br>

                    Longitude:
                    ${longitude}

                    <br>

                    🎯 Accuracy:
                    ${accuracy.toFixed(1)} m

                    <br><br>

                    ⏳ Madam Location save हो रही है...

                `;


                saveLocation(
                    latitude,
                    longitude,
                    accuracy
                );

            },

            error => {

                document.getElementById(
                    "status"
                ).innerHTML =

                    "❌ GPS Error: " +
                    error.message;
            },

            {

                enableHighAccuracy: true,

                maximumAge: 0,

                timeout: 30000
            }
        );
}


/* ==========================================
   SAVE LOCATION
========================================== */

async function saveLocation(
    latitude,
    longitude,
    accuracy
) {

    try {

        /* ==============================
           CITY / STATE
        ============================== */

        let city = "";
        let state = "";


        try {

            const geoURL =
                "https://api.bigdatacloud.net/data/" +
                "reverse-geocode-client" +
                "?latitude=" +
                latitude +
                "&longitude=" +
                longitude +
                "&localityLanguage=en";


            const geoResponse =
                await fetch(geoURL);


            if (geoResponse.ok) {

                const geoData =
                    await geoResponse.json();


                city =
                    geoData.city ||
                    geoData.locality ||
                    "";


                state =
                    geoData.principalSubdivision ||
                    "";
            }

        } catch (geoError) {

            console.log(
                "Reverse geocoding failed:",
                geoError
            );
        }


        /* ==============================
           SUPABASE
        ============================== */

        const response =
            await fetch(
                SUPABASE_URL +
                "/rest/v1/locations",
                {

                    method: "POST",

                    headers: {

                        "apikey":
                            SUPABASE_KEY,

                        "Content-Type":
                            "application/json",

                        "Accept":
                            "application/json",

                        "Prefer":
                            "return=representation"
                    },

                    body:
                        JSON.stringify({

                            device_id:
                                deviceId,

                            latitude:
                                latitude,

                            longitude:
                                longitude,

                            accuracy:
                                accuracy,

                            city:
                                city,

                            state:
                                state
                        })
                }
            );


        if (!response.ok) {

            const errorText =
                await response.text();

            throw new Error(
                errorText
            );
        }


        document.getElementById(
            "status"
        ).innerHTML = `

            ✅ Madam Location Saved

            <br><br>

            📍 Latitude:
            ${latitude}

            <br>

            📍 Longitude:
            ${longitude}

            <br>

            🎯 Accuracy:
            ${accuracy.toFixed(1)} m

            <br>

            🏙️ Madam City:
            ${city || "-"}

            <br>

            🗺️ Madam State:
            ${state || "-"}

            <br><br>

            🟢 Madam GPS tracking चालू है...

        `;


    } catch (error) {

        console.error(
            "Supabase Error:",
            error
        );


        document.getElementById(
            "status"
        ).innerHTML = `

            ⚠️ Madam GPS मिल रहा है लेकिन
            server पर save नहीं हो पाया.

            <br><br>

            ${error.message}

        `;
    }
}


/* ==========================================
   STOP
========================================== */

function stopTracking() {

    if (watchId !== null) {

        navigator.geolocation.clearWatch(
            watchId
        );

        watchId = null;
    }


    document.getElementById(
        "status"
    ).innerHTML =
        "⏹ Madam Location tracking बंद है.";
}

</script>

</body>
</html>
