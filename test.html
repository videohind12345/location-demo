<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Supabase Connection Test</title>

<style>
body {
    font-family: Arial, sans-serif;
    padding: 30px;
    background: #f5f5f5;
}

button {
    padding: 15px 25px;
    font-size: 18px;
    cursor: pointer;
    background: green;
    color: white;
    border: none;
    border-radius: 8px;
}

#result {
    margin-top: 20px;
    padding: 15px;
    background: white;
    border-radius: 8px;
    white-space: pre-wrap;
    word-break: break-word;
}
</style>
</head>

<body>

<h2>🔧 Supabase Connection Test</h2>

<button onclick="testSupabase()">TEST SUPABASE</button>

<div id="result">Test नहीं हुआ है।</div>

<script>

const SUPABASE_URL =
"https://qtfnupdojsqpuywhoryu.supabase.co";

const SUPABASE_KEY =
"sb_publishable_GAsXGjXdKTZxlm5tqx-t0w_96i3RmKE";


async function testSupabase() {

    const result = document.getElementById("result");

    result.innerHTML = "⏳ Supabase से connection test हो रहा है...";

    const url =
        SUPABASE_URL +
        "/rest/v1/locations" +
        "?select=*" +
        "&limit=1";

    try {

        console.log("Testing:", url);

        const response = await fetch(url, {
            method: "GET",

            headers: {
                "apikey": SUPABASE_KEY
            }
        });

        const text = await response.text();

        result.innerHTML =
            "✅ SUPABASE REACHED\n\n" +
            "HTTP STATUS: " + response.status +
            "\n\nRESPONSE:\n" + text;

    } catch (error) {

        result.innerHTML =
            "❌ BROWSER FETCH FAILED\n\n" +
            "ERROR:\n" + error.message;

        console.error(error);
    }
}

</script>

</body>
</html>
